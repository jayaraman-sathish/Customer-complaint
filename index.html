<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Audree Complaint Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#E7ECEE; --surface:#FFFFFF; --surface-2:#F1F5F6; --surface-3:#E2E9EB;
  --line:#C7D3D8; --line-2:#DCE4E7;
  --ink:#0F171B; --ink-2:#3E4F57; --ink-3:#6D8089;
  --copper:#A2542A; --copper-2:#C4763F; --copper-wash:#F3E6DC;
  --ok:#1C7A5B; --ok-wash:#DDF0E8;
  --warn:#9C6607; --warn-wash:#F7ECD5;
  --crit:#AC3125; --crit-wash:#F8E0DC;
  --info:#2E5E80; --info-wash:#E0EAF1;
  --shadow-1:0 1px 2px rgba(15,23,27,.07);
  --shadow-2:0 2px 4px rgba(15,23,27,.06),0 14px 30px -18px rgba(15,23,27,.35);
  --r:6px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0C1215; --surface:#151E22; --surface-2:#1B262B; --surface-3:#222F35;
    --line:#2C3A41; --line-2:#232F35;
    --ink:#E1EAED; --ink-2:#A7B9C0; --ink-3:#7A8D95;
    --copper:#DB8853; --copper-2:#EBA478; --copper-wash:#2D1C12;
    --ok:#4FC095; --ok-wash:#0F2A20;
    --warn:#DCA745; --warn-wash:#2A2010;
    --crit:#E5735F; --crit-wash:#2D1512;
    --info:#79ADD3; --info-wash:#14252F;
    --shadow-1:0 1px 2px rgba(0,0,0,.5);
    --shadow-2:0 2px 4px rgba(0,0,0,.4),0 14px 30px -18px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0C1215; --surface:#151E22; --surface-2:#1B262B; --surface-3:#222F35;
  --line:#2C3A41; --line-2:#232F35;
  --ink:#E1EAED; --ink-2:#A7B9C0; --ink-3:#7A8D95;
  --copper:#DB8853; --copper-2:#EBA478; --copper-wash:#2D1C12;
  --ok:#4FC095; --ok-wash:#0F2A20;
  --warn:#DCA745; --warn-wash:#2A2010;
  --crit:#E5735F; --crit-wash:#2D1512;
  --info:#79ADD3; --info-wash:#14252F;
  --shadow-1:0 1px 2px rgba(0,0,0,.5);
  --shadow-2:0 2px 4px rgba(0,0,0,.4),0 14px 30px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:Archivo,"IBM Plex Sans",system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:Archivo,sans-serif;font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}
.mark{width:30px;height:30px;border-radius:4px;background:var(--copper);display:grid;place-items:center;flex:none;box-shadow:inset 0 -8px 12px -8px rgba(0,0,0,.5)}
.mark span{font-family:Archivo;font-weight:700;font-size:14px;color:#fff;letter-spacing:-.04em}
.brand b{font-family:Archivo;font-size:14.5px;font-weight:700;display:block;line-height:1.15}
.brand small{font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}
.navgroup{margin-top:12px;padding:0 8px 4px}
.nav{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--r);cursor:pointer;color:var(--ink-2);border:1px solid transparent;background:none;width:100%;text-align:left;font-size:13.5px}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="true"]{background:var(--copper-wash);color:var(--copper);border-color:color-mix(in srgb,var(--copper) 26%,transparent);font-weight:600}
.nav svg{flex:none;width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
.nav .count{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--surface-3);color:var(--ink-2);border-radius:9px;padding:1px 6px}
.railfoot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line-2);font-size:11px;color:var(--ink-3);line-height:1.45}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.topbar h1{font-size:17px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:11.5px;color:var(--ink-2);background:var(--surface-2)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.rolepick{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:5px 8px;font-size:12.5px}
.iconbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:5px 9px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-3);color:var(--ink)}
.view{padding:22px 24px 56px;max-width:1360px;width:100%}

/* ---------- primitives ---------- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 13px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary{background:var(--copper);border-color:var(--copper);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--copper-2);border-color:var(--copper-2)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.pad{padding:16px 18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11.5px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;font-size:13.5px;width:100%}
.field textarea{resize:vertical;min-height:76px;line-height:1.5}
.field .hint{font-size:11px;color:var(--ink-3)}
.req::after{content:" *";color:var(--crit)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;font-family:Archivo,sans-serif;letter-spacing:.02em}
.p-new{background:var(--copper-wash);color:var(--copper)}
.p-info{background:var(--info-wash);color:var(--info)}
.p-warn{background:var(--warn-wash);color:var(--warn)}
.p-ok{background:var(--ok-wash);color:var(--ok)}
.p-crit{background:var(--crit-wash);color:var(--crit)}
.p-mute{background:var(--surface-3);color:var(--ink-3)}

.sev{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.sev i{width:3px;height:13px;border-radius:2px;display:inline-block}
.sev-Critical i{background:var(--crit)} .sev-Critical{color:var(--crit)}
.sev-Major i{background:var(--warn)} .sev-Major{color:var(--warn)}
.sev-Minor i{background:var(--ink-3)} .sev-Minor{color:var(--ink-2)}

table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-family:Archivo,sans-serif;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
tbody tr.clickable{cursor:pointer}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tablewrap table{min-width:980px}
tbody tr:last-child td{border-bottom:none}

.empty{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:13px}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:13px 15px;display:flex;flex-direction:column;gap:3px}
.kpi .v{font-family:Archivo;font-size:25px;font-weight:700;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11.5px;color:var(--ink-3)}
.kpi .d{font-size:11px;font-weight:600}
.kpi.alert .v{color:var(--crit)}

.panelhead{display:flex;align-items:baseline;gap:10px;padding:13px 18px 0}
.panelhead h3{font-size:14px}
.panelhead .sub{font-size:11.5px;color:var(--ink-3)}

.bars{display:flex;flex-direction:column;gap:9px;padding:14px 18px 18px}
.bar{display:grid;grid-template-columns:minmax(96px,34%) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.bar .lab{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:9px;background:var(--surface-3);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;border-radius:5px;background:var(--copper)}
.bar .val{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:22px;text-align:right}

.cols{display:flex;align-items:flex-end;gap:12px;padding:20px 18px 14px;height:168px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.col .stack{width:100%;max-width:52px;border-radius:4px 4px 0 0;background:var(--copper);min-height:2px;position:relative}
.col .n{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:500}
.col .c{font-size:11px;color:var(--ink-3);text-align:center;line-height:1.25}

.donutwrap{display:flex;gap:18px;align-items:center;padding:16px 18px 20px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12.5px;min-width:150px;flex:1}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:9px;height:9px;border-radius:2px;flex:none}
.legend .n{margin-left:auto;font-family:"IBM Plex Mono",monospace;color:var(--ink-2)}

/* ---------- queue ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input[type=search],.filters select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;font-size:13px}
.filters input[type=search]{min-width:210px}
.tabbar{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{border:none;background:none;padding:9px 13px;cursor:pointer;font-size:13px;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--copper);border-bottom-color:var(--copper);font-weight:600}
.tab .tc{font-family:"IBM Plex Mono",monospace;font-size:10.5px;background:var(--surface-3);color:var(--ink-3);border-radius:9px;padding:1px 6px;margin-left:6px}
.tab[aria-selected="true"] .tc{background:var(--copper-wash);color:var(--copper)}
.tools{display:flex;gap:4px;flex-wrap:wrap}
.tool{font-size:10.5px;font-family:Archivo,sans-serif;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.tool.rca{border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-wash);color:var(--ok)}

/* ---------- case file ---------- */
.casehead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.casehead h2{font-size:21px;letter-spacing:-.02em}
.caseid{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--copper);font-weight:500}
.casegrid{display:grid;grid-template-columns:1fr 316px;gap:16px;align-items:start}
@media(max-width:1080px){.casegrid{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:118px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--ink-3);font-size:12px}
.kv dd{margin:0;overflow-wrap:anywhere}
.section{border-top:1px solid var(--line-2);padding-top:14px;margin-top:14px}
.section:first-child{border-top:none;padding-top:0;margin-top:0}
.section h4{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin-bottom:10px;font-weight:600}

.timeline{display:flex;flex-direction:column;gap:0;position:relative}
.tl{display:grid;grid-template-columns:22px 1fr;gap:10px;padding-bottom:14px;position:relative}
.tl:not(:last-child)::before{content:"";position:absolute;left:10px;top:18px;bottom:0;width:1px;background:var(--line)}
.tl .mk{width:21px;height:21px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;z-index:1}
.tl.done .mk{background:var(--ok-wash);border-color:var(--ok);color:var(--ok)}
.tl.now .mk{background:var(--copper);border-color:var(--copper);color:#fff}
.tl .t{font-size:13px;font-weight:600}
.tl .m{font-size:12px;color:var(--ink-3)}

.note{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin-bottom:12px}
.note .h{font-size:11.5px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap}
.note .b{font-size:13px;margin-top:2px}

.evidence{display:flex;gap:8px;flex-wrap:wrap}
.ev{width:78px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface-2);font-size:10px;text-align:center}
.ev img{width:100%;height:58px;object-fit:cover;display:block}
.ev .ph{height:58px;display:grid;place-items:center;color:var(--ink-3);font-size:18px}
.ev .nm{padding:3px 4px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.capa{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;background:var(--surface-2)}
.capa .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.capa .meta{font-size:11.5px;color:var(--ink-3);display:flex;gap:12px;flex-wrap:wrap;margin-top:5px}

.actionbox{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.actionbox h4{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin-bottom:10px;font-weight:600}
.stagenote{font-size:12px;color:var(--ink-3);margin-bottom:10px;line-height:1.45}
.denied{font-size:11.5px;color:var(--warn);background:var(--warn-wash);border-radius:var(--r);padding:7px 9px;line-height:1.4}


.toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.toolbtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 11px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.toolbtn b{font-family:Archivo,sans-serif;font-size:12.5px;font-weight:600}
.toolbtn small{font-size:10.5px;color:var(--ink-3);line-height:1.3}
.toolbtn:hover{border-color:var(--copper)}
.toolbtn[aria-pressed="true"]{background:var(--copper-wash);border-color:var(--copper);color:var(--copper)}
.toolbtn[aria-pressed="true"] small{color:var(--copper)}
.whys{margin:6px 0 4px;padding-left:20px;font-size:13px;line-height:1.55}
.whys li::marker{font-family:"IBM Plex Mono",monospace;color:var(--copper);font-weight:600}
.checks{display:flex;flex-direction:column;gap:5px;margin:10px 0 4px;font-size:12.5px;color:var(--ink-3)}
.checks div{display:flex;gap:8px;align-items:center}
.checks i{font-style:normal;width:16px;text-align:center;font-family:"IBM Plex Mono",monospace}
.checks .on{color:var(--ink)} .checks .on i{color:var(--ok)}


.chip.waiting{background:var(--copper-wash);border-color:color-mix(in srgb,var(--copper) 26%,transparent);color:var(--copper)}
.chip.waiting b{font-weight:600}
.tasklist{display:flex;flex-direction:column}
.task{padding:12px 18px;border-top:1px solid var(--line-2);cursor:pointer;display:flex;flex-direction:column;gap:5px}
.task:first-child{border-top:none}
.task:hover{background:var(--surface-2)}
.tw{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tt{font-size:14px;font-weight:500;font-family:Archivo,sans-serif}
.tm{font-size:12px;color:var(--ink-3)}
.owner{font-size:12.5px;line-height:1.45;background:var(--surface-3);border-radius:var(--r);padding:8px 10px;margin-bottom:10px;color:var(--ink-2)}
.owner.me{background:var(--ok-wash);color:var(--ok)}
.owner b{font-weight:600}


.callout{font-size:13px;line-height:1.5;background:var(--surface-2);border-left:3px solid var(--copper);border-radius:0 var(--r) var(--r) 0;padding:10px 12px;margin-bottom:10px;color:var(--ink-2)}
.callout.crit{border-left-color:var(--crit);background:var(--crit-wash);color:var(--crit)}
.callout a{color:inherit}
.rgrp{margin-bottom:14px}
.rgh{font-family:Archivo,sans-serif;font-size:12.5px;font-weight:600;display:flex;gap:7px;align-items:center}
.rgn{font-family:"IBM Plex Mono",monospace;font-size:10.5px;background:var(--surface-3);color:var(--ink-3);border-radius:9px;padding:1px 6px}
.rgm{font-size:11.5px;color:var(--ink-3);margin-bottom:6px}
.rrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:12.5px;padding:4px 0;border-top:1px solid var(--line-2)}
.rrow a{color:var(--copper);text-decoration:none}
.rd{color:var(--ink-3);font-size:11.5px}
.rc{font-size:11.5px;color:var(--ink-2)}
.confirmbox{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.ch{font-family:Archivo,sans-serif;font-size:13.5px;font-weight:600;margin-bottom:8px}
.confirmbox textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:13px;min-height:54px;background:var(--surface);resize:vertical}
.crow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.cresp{margin-top:12px;border-radius:var(--r);padding:9px 11px;font-size:12.5px;line-height:1.45}
.cresp.ok{background:var(--ok-wash);color:var(--ok)}
.cresp.no{background:var(--crit-wash);color:var(--crit)}

/* ---------- customer portal ---------- */
.portal{display:grid;grid-template-columns:392px 1fr;gap:26px;align-items:start}
@media(max-width:940px){.portal{grid-template-columns:1fr}}
.phone{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:10px;box-shadow:var(--shadow-2)}
.screen{background:var(--ground);border-radius:18px;overflow:hidden;height:clamp(500px,calc(100vh - 150px),684px);display:flex;flex-direction:column}
.qr{cursor:pointer}
.qr:hover{border-color:var(--copper)}
.scanhint{font-size:11px;color:var(--ink-3);text-align:center;margin-top:5px}
.statusbar{display:flex;justify-content:space-between;padding:8px 16px 4px;font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.pbar{background:var(--ink);color:var(--surface);padding:11px 16px;display:flex;align-items:center;gap:9px}
:root[data-theme="dark"] .pbar,:root:not([data-theme="light"]) .pbar{}
.pbar .m{width:22px;height:22px;border-radius:3px;background:var(--copper);display:grid;place-items:center;font-family:Archivo;font-weight:700;font-size:10px;color:#fff;flex:none}
.pbar b{font-family:Archivo;font-size:13px;font-weight:600;color:var(--ground)}
.pbar small{font-size:10px;opacity:.6;display:block;color:var(--ground)}
.pbody{flex:1;overflow-y:auto;padding:16px}
.pbody::-webkit-scrollbar{width:5px}
.pbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.pctx{background:var(--copper-wash);border:1px solid color-mix(in srgb,var(--copper) 24%,transparent);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.pctx .b{font-family:Archivo;font-weight:600;font-size:15px;color:var(--copper)}
.pchoice{display:flex;flex-direction:column;gap:10px}
.bigbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:15px;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.bigbtn:hover{border-color:var(--copper);background:var(--copper-wash)}
.bigbtn b{display:block;font-family:Archivo;font-size:14px}
.bigbtn small{color:var(--ink-3);font-size:11.5px;line-height:1.4;display:block;margin-top:2px}
.bigbtn .ic{font-size:19px;line-height:1}
.steps{display:flex;gap:5px;margin-bottom:14px}
.steps i{height:3px;flex:1;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--copper)}
.pfield{margin-bottom:11px}
.pfield label{font-size:11px;font-weight:600;color:var(--ink-2);display:block;margin-bottom:4px}
.pfield input,.pfield select,.pfield textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 10px;font-size:13.5px;background:var(--surface)}
.pfield textarea{min-height:82px;resize:vertical}
.err{color:var(--crit);font-size:11px;margin-top:3px}
.pfoot{padding:11px 16px;border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px}
.pfoot .btn{flex:1;justify-content:center;text-align:center}
.stars{display:flex;gap:5px}
.stars button{background:none;border:none;font-size:25px;cursor:pointer;color:var(--line);padding:0;line-height:1}
.stars button.on{color:var(--copper-2)}
.ack{text-align:center;padding:20px 6px}
.ack .tick{width:52px;height:52px;border-radius:50%;background:var(--ok-wash);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px;font-size:25px}
.ref{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;color:var(--copper);letter-spacing:.02em;margin:8px 0}
.qrpanel{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.qr{width:118px;height:118px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;flex:none}
.qr svg{width:100%;height:100%;display:block}
.skulist{display:flex;flex-wrap:wrap;gap:6px}
.skubtn{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 11px;font-size:12px;cursor:pointer}
.skubtn[aria-pressed="true"]{background:var(--copper);border-color:var(--copper);color:#fff;font-weight:500}

/* ---------- consumer-only page (what a phone sees after scanning) ---------- */
body.consumer #app{display:none}
body.consumer{background:var(--ground)}
.cpage{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--ground)}
.cpage .pbar{position:sticky;top:0;z-index:5}
.cpage .pbody{flex:1;padding:18px 16px 24px}
.cpage .pfoot{position:sticky;bottom:0}
.cfoot{text-align:center;font-size:11px;color:var(--ink-3);padding:12px 16px 20px;max-width:480px;margin:0 auto}

/* ---------- admin ---------- */
.adminsplit{display:grid;grid-template-columns:206px 1fr;gap:18px;align-items:start}
@media(max-width:840px){.adminsplit{grid-template-columns:1fr}}
.sidelist{display:flex;flex-direction:column;gap:2px}
.sidelist button{border:none;background:none;text-align:left;padding:7px 10px;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--ink-2)}
.sidelist button:hover{background:var(--surface-2)}
.sidelist button[aria-current="true"]{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:600}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:20px;font-size:13px;box-shadow:var(--shadow-2);z-index:200;max-width:88vw}
:root[data-theme="dark"] .toast,:root:not([data-theme="light"]) .toast{background:var(--surface-3);color:var(--ink);border:1px solid var(--line)}

.modalbg{position:fixed;inset:0;background:rgba(10,16,19,.55);display:grid;place-items:center;z-index:150;padding:20px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;max-width:520px;width:100%;box-shadow:var(--shadow-2);max-height:88vh;overflow:auto}
.modal .mh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{font-size:15px}
.modal .mb{padding:16px 18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}

@media(max-width:860px){
  #app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;overflow-x:auto;align-items:center;border-right:none;border-bottom:1px solid var(--line);padding:8px 10px}
  .brand{padding:0 12px 0 4px;flex:none} .brand small{display:none}
  .navgroup{display:none} .railfoot{display:none}
  .nav{width:auto;flex:none} .nav .count{display:none}
  .view{padding:16px 14px 48px}
  .casegrid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="app">
  <nav class="rail" id="rail"></nav>
  <div class="main">

    <div class="view" id="view"></div>
  </div>
</div>
<div id="overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
"use strict";

/* ============================ MASTERS ============================ */

  {name:"S. Kulkarni",  role:"Customer Care Executive", dept:"Customer Care", active:true},
  {name:"A. Menon",     role:"QA/QC User", dept:"Quality Assurance", active:true},
  {name:"P. Iyer",      role:"QA/QC User", dept:"Quality Assurance", active:true},
  {name:"V. Rathod",    role:"Plant / Dept User", dept:"Bottling & Production", active:true},
  {name:"N. Bhatt",     role:"Plant / Dept User", dept:"Packaging", active:true},
  {name:"K. Suresh",    role:"QA Manager", dept:"Quality Assurance", active:true},
  {name:"M. Fernandes", role:"Management (read-only)", dept:"Management", active:true},
  {name:"admin",        role:"System Administrator", dept:"IT", active:true}

let TEMPLATES = [
  {key:"ACK", subject:"We have received your complaint — {{ref}}", body:"Dear {{customer}},\n\nThank you for writing to "+COMPANY+". Your reference number is {{ref}}. Our quality team will respond within {{respSla}} working hours.\n\nQuality Assurance, "+COMPANY},
  {key:"ASSIGN", subject:"Case {{ref}} assigned to you", body:"Case {{ref}} ({{severity}} / {{category}}) has been assigned to {{assignee}}. Resolution due {{due}}."},
  {key:"ESCALATE", subject:"ESCALATION — {{ref}} breaching SLA", body:"Case {{ref}} has crossed its resolution SLA. Batch {{batch}} from {{plant}}. Immediate review required."},
  {key:"CLOSURE", subject:"Your complaint {{ref}} has been resolved", body:"Dear {{customer}},\n\nYour complaint {{ref}} has been investigated and closed.\n\nOutcome: {{resolution}}\n\nThank you for helping us improve.\n\nQuality Assurance, "+COMPANY}
];

const STATUS_FLOW = ["New","Classified","Under Investigation","RCA & CAPA","Pending Approval","Resolved","Closed"];
const STATUS_TONE = {"New":"p-new","Classified":"p-info","Under Investigation":"p-warn","RCA & CAPA":"p-warn","Pending Approval":"p-warn","Resolved":"p-ok","Closed":"p-mute","Rejected":"p-mute","Duplicate":"p-mute"};

/* ============================ STATE ============================ */
const NOW = new Date("2026-09-04T11:20:00");
const LS_KEY = "meridian_ccfms_v1";
const SEED_VERSION = 6;   // bump whenever the seeded demo data changes

let state = {
  view:"tasks", role:"QA Manager", user:"K. Suresh",
  caseId:null, caseTab:"summary",
  queueTab:"open", q:"", fSev:"", fStatus:"", fBrand:"", fDept:"",
  adminTab:"categories", reportKind:"overview",
  portal:{step:"choice", type:null, data:{}, errors:{}, evidence:[], ref:null, trackRef:"", trackMob:"", trackResult:undefined, sku:"KR-750"}
};

let DB = {cases:[], seq:{C:0,F:0}, audit:[]};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso = d => d.toISOString();
const hoursBetween = (a,b) => (b-a)/36e5;
const addH = (d,h) => new Date(d.getTime()+h*36e5);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const p2 = n => String(n).padStart(2,"0");
const fmtD  = s => { if(!s) return "—"; const d=new Date(s); return p2(d.getDate())+" "+MON[d.getMonth()]+" "+d.getFullYear(); };
const fmtDT = s => { const d=new Date(s); return fmtD(s)+" · "+p2(d.getHours())+":"+p2(d.getMinutes()); };
const can = c => (ROLES[state.role]||[]).includes(c);
const sevOf = n => SEVERITIES.find(s=>s.name===n) || SEVERITIES[2];
const catOf = n => CATEGORIES.find(c=>c.name===n);
const canInvestigate = u => u.active && (ROLES[u.role]||[]).includes("investigate");
const investigators = dept => { const inD=USERS.filter(u=>canInvestigate(u)&&u.dept===dept); return inD.length?inD:USERS.filter(u=>canInvestigate(u)&&u.role==="QA Manager"); };
const openCases = () => DB.cases.filter(c => c.type==="Complaint" && !["Closed","Rejected","Duplicate"].includes(c.status));

function ageH(c){ return hoursBetween(new Date(c.createdAt), new Date(c.closure?.at || c.resolution?.at || NOW)); }
function dueAt(c){ return addH(new Date(c.createdAt), sevOf(c.severity).resHrs); }
function slaState(c){
  if(c.type==="Feedback") return {label:"—", tone:"p-mute"};
  const stopped = c.closure?.at || c.resolution?.at;
  const due = dueAt(c), ref = new Date(stopped || NOW);
  if(stopped) return ref>due ? {label:"Breached", tone:"p-crit"} : {label:"Met", tone:"p-ok"};
  const left = hoursBetween(ref, due);
  if(left < 0) return {label:"Breached "+Math.round(-left)+"h", tone:"p-crit"};
  if(left < sevOf(c.severity).resHrs*0.25) return {label:"Due in "+Math.round(left)+"h", tone:"p-warn"};
  return {label:Math.round(left)+"h left", tone:"p-ok"};
}
function ageLabel(c){ const h=ageH(c); return h<48 ? Math.round(h)+"h" : Math.round(h/24)+"d"; }

function log(c, action, detail){
  const e = {at:iso(NOW), by:state.user+" ("+state.role+")", action, detail:detail||""};
  c.audit.push(e);
  DB.audit.unshift(Object.assign({ref:c.id}, e));
}
function mail(c, key, extra){
  const t = TEMPLATES.find(t=>t.key===key); if(!t) return;
  const map = Object.assign({
    ref:c.id, customer:c.customer.name, severity:c.severity, category:c.category,
    respSla:sevOf(c.severity).respHrs, assignee:c.assignee||"—", due:fmtD(dueAt(c)),
    batch:c.trace.batch, plant:c.trace.plant, resolution:c.resolution?.text||"—"
  }, extra||{});
  const fill = s => s.replace(/\{\{(\w+)\}\}/g, (_,k)=> map[k]!=null?map[k]:"—");
  c.outbox.push({at:iso(NOW), to:c.customer.email||"internal", subject:fill(t.subject), body:fill(t.body), key});
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({v:SEED_VERSION, cases:DB.cases, seq:DB.seq, audit:DB.audit.slice(0,400)})); }catch(e){} }
function load(){ try{
  const r=localStorage.getItem(LS_KEY); if(!r) return false;
  const d=JSON.parse(r); if(!d||!Array.isArray(d.cases)||!d.cases.length) return false;
  if(d.v!==SEED_VERSION) return false;          // demo data from an older build — reseed
  DB=d; DB.audit=DB.audit||[]; return true;
}catch(e){ return false; } }
function nextId(type){
  if(type==="Feedback"){ DB.seq.F++; return "FBK-2026-"+String(DB.seq.F).padStart(4,"0"); }
  DB.seq.C++; return "CMP-2026-"+String(DB.seq.C).padStart(4,"0");
}
function toast(msg){
  const old=document.querySelector(".toast"); if(old) old.remove();
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}

function frame(inner){ return '<rect width="200" height="260" fill="'+PHOTO_BG+'"/>'+

/* ============================ REPEATS, DUPLICATES, RECURRENCE ============================ */
const CLOSED_SET=["Closed","Rejected","Duplicate"];
function duplicatesOf(id){ return DB.cases.filter(c=>c.duplicateOf===id); }
function parentOf(c){ return c.duplicateOf ? DB.cases.find(x=>x.id===c.duplicateOf) : null; }
// Candidate parents when marking a duplicate: same batch, or same SKU + category, raised earlier.
function dupCandidates(c){
  return DB.cases.filter(x=>x.id!==c.id && x.type==="Complaint" && !x.duplicateOf && x.status!=="Duplicate" &&
    (x.trace.batch===c.trace.batch || (x.product.sku===c.product.sku && x.category===c.category)))
    .sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
}
/* A repeat is the same defect on the same product raised again by a DIFFERENT consumer —
   distinct from a duplicate, which is the same consumer/incident logged twice. */
function repeatsFor(c){
  const t=new Date(c.createdAt);
  const prior=DB.cases.filter(x=>x.id!==c.id && x.type==="Complaint" && !x.duplicateOf && new Date(x.createdAt)<t);
  const sameBatch = prior.filter(x=>x.trace.batch===c.trace.batch);
  const sameDefect = prior.filter(x=>x.product.sku===c.product.sku && x.category===c.category && x.trace.batch!==c.trace.batch);
  const samePlant = prior.filter(x=>x.trace.plant===c.trace.plant && x.category===c.category && x.trace.batch!==c.trace.batch && x.product.sku!==c.product.sku);
  return {sameBatch, sameDefect, samePlant, all:[...sameBatch,...sameDefect,...samePlant]};
}
/* The signal that matters to QA: did this recur AFTER a preventive action was signed off as effective? */
function capaFailure(c){
  const r=repeatsFor(c);
  for(const prev of [...r.sameDefect, ...r.samePlant]){
    const pa=(prev.capa||[]).find(a=>a.kind==="PA" && a.effectiveness);
    if(pa && prev.closure && new Date(prev.closure.at) < new Date(c.createdAt)) return {prev, pa};
  }
  return null;
}
function repeatBadge(c){
  if(c.duplicateOf) return '<span class="pill p-mute" title="Duplicate of '+esc(c.duplicateOf)+'">DUP</span>';
  if(capaFailure(c)) return '<span class="pill p-crit" title="Recurred after a preventive action was verified effective">REPEAT</span>';
  const r=repeatsFor(c);
  if(r.sameBatch.length) return '<span class="pill p-warn" title="'+r.sameBatch.length+' earlier case(s) on batch '+esc(c.trace.batch)+'">REPEAT</span>';
  if(r.sameDefect.length>=2) return '<span class="pill p-warn" title="'+r.sameDefect.length+' earlier cases of this defect on '+esc(c.product.sku)+'">REPEAT</span>';
  return '';
}

/* ============================ TASK MODEL — who acts next ============================ */
function usersWith(cap){ return USERS.filter(u=>u.active&&(ROLES[u.role]||[]).includes(cap)).map(u=>u.name); }
function qaManagers(){ return USERS.filter(u=>u.active&&u.role==="QA Manager").map(u=>u.name); }
// The single next action on a case: what must happen, and who can do it.
function nextTask(c){
  if(["Closed","Rejected","Duplicate"].includes(c.status)) return null;
  const inv = c.assignee ? [c.assignee] : [];
  switch(c.status){
    case "New":       return {what:"Classify the case", cap:"triage",  who:usersWith("triage"), tab:"summary"};
    case "Classified":return {what:"Assign to an investigator", cap:"assign", who:usersWith("assign"), tab:"summary"};
    case "Under Investigation":
      return {what:"Record investigation findings", cap:"investigate", who:inv.length?inv:usersWith("investigate"), tab:"investigation"};
    case "RCA & CAPA":
      if(!c.rca) return {what:"Document the root cause", cap:"rca", who:inv.length?inv:usersWith("rca"), tab:"capa"};
      if(!(c.rca.review&&c.rca.review.status==="Reviewed")) return {what:"Review the RCA", cap:"approve", who:qaManagers(), tab:"capa"};
      if(!c.capa.length) return {what:"Raise a corrective / preventive action", cap:"capa", who:inv.length?inv:usersWith("capa"), tab:"capa"};
      return {what:"Submit for approval", cap:"rca", who:inv.length?inv:usersWith("rca"), tab:"capa"};
    case "Pending Approval": return {what:"Approve and write the resolution", cap:"approve", who:qaManagers(), tab:"summary"};
    case "Resolved":  return {what:"Confirm with customer and close", cap:"close", who:usersWith("close"), tab:"summary"};
  }
  return null;
}
function myCaseTasks(){ return DB.cases.map(c=>({c,t:nextTask(c)})).filter(x=>x.t&&x.t.who.includes(state.user)); }
function myCapaTasks(){ const out=[]; const appr=(ROLES[state.role]||[]).includes("approve");
  DB.cases.forEach(c=>c.capa.forEach((a,i)=>{
    if(a.owner===state.user&&a.status!=="Completed") out.push({c,a,i,job:"Complete this action"});
    else if(appr&&a.status==="Completed"&&!a.effectiveness) out.push({c,a,i,job:"Verify effectiveness"});
  })); return out; }
function myTaskCount(){ return myCaseTasks().length + myCapaTasks().length; }
function waitingChip(c){
  const t=nextTask(c); if(!t) return '';
  const many=t.who.length>1;
  return '<span class="chip waiting" title="'+esc(t.who.join(", "))+'">Waiting on <b>'+esc(t.who[0])+(many?" +"+(t.who.length-1):"")+'</b> · '+esc(t.what)+'</span>';
}

/* ============================ CHART HELPERS ============================ */
function barList(items, opts){
  opts = opts||{};
  const max = Math.max(1, ...items.map(i=>i.value));
  if(!items.length) return '<div class="empty">No data for this selection.</div>';
  return '<div class="bars">'+items.map(i=>
    '<div class="bar"><div class="lab" title="'+esc(i.label)+'">'+esc(i.label)+'</div>'+
    '<div class="track"><div class="fill" style="width:'+Math.max(2,(i.value/max)*100)+'%;background:'+(i.color||"var(--copper)")+'"></div></div>'+
    '<div class="val">'+i.value+(opts.suffix||"")+'</div></div>').join("")+'</div>';
}
function colChart(items){
  const max = Math.max(1, ...items.map(i=>i.value));
  return '<div class="cols">'+items.map(i=>
    '<div class="col"><div class="n">'+i.value+'</div>'+
    '<div class="stack" style="height:'+(i.value/max*100)+'%;background:'+(i.color||"var(--copper)")+'"></div>'+
    '<div class="c">'+esc(i.label)+'</div></div>').join("")+'</div>';
}
function donut(items){
  const total = items.reduce((s,i)=>s+i.value,0) || 1;
  const R=52, C=2*Math.PI*R; let off=0;
  const arcs = items.filter(i=>i.value>0).map(i=>{
    const len = i.value/total*C;
    const seg = '<circle cx="64" cy="64" r="'+R+'" fill="none" stroke="'+i.color+'" stroke-width="19" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 64 64)"></circle>';
    off += len; return seg;
  }).join("");
  return '<div class="donutwrap"><svg viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Case status split">'+
    '<circle cx="64" cy="64" r="'+R+'" fill="none" stroke="var(--surface-3)" stroke-width="19"></circle>'+arcs+
    '<text x="64" y="60" text-anchor="middle" fill="var(--ink)" font-family="Archivo" font-size="25" font-weight="700">'+total+'</text>'+
    '<text x="64" y="77" text-anchor="middle" fill="var(--ink-3)" font-family="IBM Plex Sans" font-size="10">cases</text></svg>'+
    '<div class="legend">'+items.map(i=>'<div><i style="background:'+i.color+'"></i>'+esc(i.label)+'<span class="n">'+i.value+'</span></div>').join("")+'</div></div>';
}
const HOSTED_PORTAL = "https://jayaraman-sathish.github.io/Customer-complaint/";
function portalBase(){
  if(state.portal.baseUrl) return state.portal.baseUrl;
  let u=""; try{ u=window.top.location.href; }catch(e){}
  if(!u) u=location.href;
  u=u.split("#")[0].split("?")[0];

  if(!/^https?:\/\//i.test(u) || /claude\.ai|claudeusercontent\.com|localhost|127\.0\.0\.1/i.test(u)) u=HOSTED_PORTAL;
  return u;
}
function baseIsReachable(){ const b=portalBase(); return /^https?:\/\//i.test(b) && !/localhost|127\.0\.0\.1/i.test(b); }
const inFrame = (()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
function deepLink(sku,batch){ return portalBase()+"#sku="+encodeURIComponent(sku)+"&b="+encodeURIComponent(batch); }
function qrSvg(sku,batch){
  if(typeof qrcode==="function"){
    try{
      const q=qrcode(0,"M"); q.addData(deepLink(sku,batch)); q.make();
      return q.createSvgTag({scalable:true, margin:0}).replace('fill="white"','fill="transparent"').replace('fill="black"','fill="var(--ink)"');
    }catch(e){}
  }
  // fallback: deterministic pseudo-QR block pattern
  let cells="", g=(x,y)=>((x*7+y*13+((x*y)%5)*3)%11)<5;
  for(let y=0;y<21;y++) for(let x=0;x<21;x++){
    const finder = (x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);
    let on = finder ? ((x%6===0||y%6===0)||(x>1&&x<5&&y>1&&y<5)||(x>15&&x<19&&y>1&&y<5)||(x>1&&x<5&&y>15&&y<19)) : g(x,y);
    if(on) cells += '<rect x="'+x+'" y="'+y+'" width="1" height="1"></rect>';
  }
  return '<svg viewBox="0 0 21 21" fill="var(--ink)" shape-rendering="crispEdges" role="img" aria-label="Product QR code">'+cells+'</svg>';
}

/* ============================ VIEWS ============================ */
function vDashboard(){
  const comp = DB.cases.filter(c=>c.type==="Complaint");
  const open = openCases();
  const closed = comp.filter(c=>c.status==="Closed");
  const breached = open.filter(c=>slaState(c).tone==="p-crit");
  const crit = open.filter(c=>c.severity==="Critical");
  const fb = DB.cases.filter(c=>c.type==="Feedback");
  const rated = fb.filter(c=>c.rating);
  const avgRating = rated.length ? (rated.reduce((s,c)=>s+c.rating,0)/rated.length).toFixed(1) : "—";
  const metOnTime = closed.filter(c=>slaState(c).label==="Met").length;
  const slaPct = closed.length ? Math.round(metOnTime/closed.length*100) : 0;
  const avgRes = closed.length ? Math.round(closed.reduce((s,c)=>s+ageH(c),0)/closed.length/24*10)/10 : 0;

  const byStatus = STATUS_FLOW.map(s=>({label:s, value:comp.filter(c=>c.status===s).length}));
  const statusColors={"New":"var(--copper)","Classified":"var(--info)","Under Investigation":"var(--warn)","RCA & CAPA":"var(--warn)","Pending Approval":"var(--warn)","Resolved":"var(--ok)","Closed":"var(--ink-3)"};
  const donutData = byStatus.filter(s=>s.value>0).map(s=>({label:s.label,value:s.value,color:statusColors[s.label]}));

  const byBrand = BRANDS.map(b=>({label:b.name, value:comp.filter(c=>c.product.brand===b.name).length})).sort((a,b)=>b.value-a.value);
  const byCat = CATEGORIES.map(c=>({label:c.name, value:comp.filter(x=>x.category===c.name).length})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);
  const byPlant = PLANTS.map(p=>({label:p.replace(" (Contract Bottler)"," (CB)"), value:comp.filter(c=>c.trace.plant===p).length})).sort((a,b)=>b.value-a.value);
  const bands=[{label:"0–2 days",lo:0,hi:48},{label:"2–5 days",lo:48,hi:120},{label:"5–10 days",lo:120,hi:240},{label:"10–20 days",lo:240,hi:480},{label:"20 days +",lo:480,hi:1e9}];
  const ageing = bands.map(b=>{ const v=open.filter(c=>{const h=ageH(c);return h>=b.lo&&h<b.hi;}).length; return {label:b.label,value:v,color:b.lo>=240?"var(--crit)":b.lo>=120?"var(--warn)":"var(--copper)"};});
  const causes=["Process","Equipment","Material","External"];
  const byCause = causes.map(k=>({label:k, value:comp.filter(c=>c.rca&&c.rca.cause===k).length}));

  return `
  <div class="grid" style="gap:16px">
    <div class="kpis">
      <div class="kpi"><span class="v">${comp.length}</span><span class="l">Complaints received</span><span class="d muted">${fb.length} feedback entries</span></div>
      <div class="kpi"><span class="v">${open.length}</span><span class="l">Open cases</span><span class="d muted">${comp.filter(c=>c.status==="New").length} awaiting classification</span></div>
      <div class="kpi ${breached.length?"alert":""}"><span class="v">${breached.length}</span><span class="l">SLA breached</span><span class="d" style="color:${breached.length?"var(--crit)":"var(--ok)"}">${breached.length?"Escalation required":"All within SLA"}</span></div>
      <div class="kpi"><span class="v">${crit.length}</span><span class="l">Open critical</span><span class="d muted">Containment review due</span></div>
      <div class="kpi"><span class="v">${slaPct}%</span><span class="l">SLA met on closure</span><span class="d muted">${metOnTime} of ${closed.length} closed</span></div>
      <div class="kpi"><span class="v">${avgRes}<span style="font-size:14px;font-weight:600"> d</span></span><span class="l">Avg. resolution time</span><span class="d muted">registration to closure</span></div>
      <div class="kpi"><span class="v">${avgRating}</span><span class="l">Avg. feedback rating</span><span class="d muted">${rated.length} ratings</span></div>
      ${(()=>{const rp=comp.filter(c=>!c.duplicateOf&&repeatsFor(c).all.length); const cf=comp.filter(c=>capaFailure(c));
        return '<div class="kpi '+(cf.length?"alert":"")+'"><span class="v">'+rp.length+'</span><span class="l">Repeat complaints</span><span class="d" style="color:'+(cf.length?"var(--crit)":"var(--ink-3)")+'">'+(cf.length?cf.length+" after a verified PA":"none after a verified PA")+'</span></div>';})()}
    </div>

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
      <div class="card"><div class="panelhead"><h3>Case status split</h3><span class="sub">complaints only</span></div>${donut(donutData)}</div>
      <div class="card"><div class="panelhead"><h3>Open case ageing</h3><span class="sub">${open.length} open</span></div>${colChart(ageing)}</div>
    </div>

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
      <div class="card"><div class="panelhead"><h3>Complaints by brand</h3></div>${barList(byBrand)}</div>
      <div class="card"><div class="panelhead"><h3>Complaints by category</h3></div>${barList(byCat)}</div>
      <div class="card"><div class="panelhead"><h3>By bottling unit</h3><span class="sub">batch traceability</span></div>${barList(byPlant)}</div>
      <div class="card"><div class="panelhead"><h3>Root cause distribution</h3><span class="sub">${comp.filter(c=>c.rca).length} cases with RCA</span></div>${barList(byCause,{})}</div>
    </div>

    <div class="card">
      <div class="panelhead" style="padding-bottom:12px"><h3>Needs attention now</h3><span class="sub">critical, escalated or SLA-breaching</span></div>
      ${caseTable(open.filter(c=>c.severity==="Critical"||c.escalated||slaState(c).tone!=="p-ok").sort((a,b)=>ageH(b)-ageH(a)))}
    </div>
  </div>`;
}

function caseTable(list){
  if(!list.length) return '<div class="empty">Nothing here right now.</div>';
  return '<div class="tablewrap" style="border:none;border-radius:0"><table><thead><tr>'+
    '<th>Reference</th><th>Brand / SKU</th><th>Category</th><th>Severity</th><th>Status</th><th>Investigation</th><th>Waiting on</th><th>Age</th><th>SLA</th></tr></thead><tbody>'+
    list.map(c=>{ const s=slaState(c); return '<tr class="clickable" data-case="'+c.id+'">'+
      '<td><span class="mono" style="color:var(--copper);font-weight:500">'+c.id+'</span> '+repeatBadge(c)+(c.escalated?' <span class="pill p-crit">ESC</span>':'')+(c.hold?' <span class="pill p-warn">HOLD</span>':'')+'</td>'+
      '<td>'+esc(c.product.brand)+'<div class="muted mono" style="font-size:11px">'+esc(c.product.sku)+' · '+esc(c.trace.batch)+'</div></td>'+
      '<td style="max-width:220px">'+esc(c.category)+'</td>'+
      '<td><span class="sev sev-'+c.severity+'"><i></i>'+c.severity+'</span></td>'+
      '<td><span class="pill '+STATUS_TONE[c.status]+'">'+esc(c.status)+'</span></td>'+
      '<td>'+toolChips(c)+'</td>'+
      '<td>'+(()=>{const t=nextTask(c); return t?esc(t.who[0])+(t.who.length>1?' <span class="muted">+'+(t.who.length-1)+'</span>':'')+'<div class="muted" style="font-size:11px">'+esc(t.what)+'</div>':'<span class="muted">—</span><div class="muted" style="font-size:11px">'+esc(c.assignee||"")+'</div>';})()+'</td>'+
      '<td class="mono">'+ageLabel(c)+'</td>'+
      '<td><span class="pill '+s.tone+'">'+s.label+'</span></td></tr>';
    }).join("")+'</tbody></table></div>';
}

function vQueue(){
  let list = DB.cases.slice();
  if(state.queueTab==="open") list = list.filter(c=>c.type==="Complaint" && !["Closed","Rejected","Duplicate"].includes(c.status));
  else if(state.queueTab==="mine") list = list.filter(c=>c.assignee===state.user);
  else if(state.queueTab==="unassigned") list = list.filter(c=>c.type==="Complaint" && !c.assignee && c.status!=="Closed");
  else if(state.queueTab==="feedback") list = list.filter(c=>c.type==="Feedback");
  else if(state.queueTab==="closed") list = list.filter(c=>["Closed","Rejected","Duplicate"].includes(c.status));
  if(state.fSev) list=list.filter(c=>c.severity===state.fSev);
  if(state.fStatus) list=list.filter(c=>c.status===state.fStatus);
  if(state.fBrand) list=list.filter(c=>c.product.brand===state.fBrand);
  if(state.fDept) list=list.filter(c=>c.department===state.fDept);
  if(state.fTool) list=list.filter(c=> state.fTool==="rca" ? !!c.rca : c.investigation.some(n=>(n.tool||"note")===state.fTool));
  if(state.q){ const q=state.q.toLowerCase();
    list=list.filter(c=>[c.id,c.customer.name,c.customer.mobile,c.trace.batch,c.product.brand,c.product.sku,c.category,c.description].join(" ").toLowerCase().includes(q)); }
  list.sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));

  const nC=c=>c.type==="Complaint";
  const counts={
    open:DB.cases.filter(c=>nC(c)&&!["Closed","Rejected","Duplicate"].includes(c.status)).length,
    unassigned:DB.cases.filter(c=>nC(c)&&!c.assignee&&c.status!=="Closed").length,
    mine:DB.cases.filter(c=>c.assignee===state.user).length,
    feedback:DB.cases.filter(c=>c.type==="Feedback").length,
    closed:DB.cases.filter(c=>["Closed","Rejected","Duplicate"].includes(c.status)).length,
    all:DB.cases.length};
  const tabs=[["open","Open"],["unassigned","Unassigned"],["mine","Assigned to me"],["feedback","Feedback"],["closed","Closed"],["all","All"]];
  return `
  <div class="tabbar" role="tablist">${tabs.map(t=>'<button class="tab" role="tab" data-qtab="'+t[0]+'" aria-selected="'+(state.queueTab===t[0])+'">'+t[1]+'<span class="tc">'+counts[t[0]]+'</span></button>').join("")}</div>
  <div class="filters">
    <input type="search" id="q" placeholder="Search reference, batch, customer, SKU…" value="${esc(state.q)}">
    <select id="fSev"><option value="">All severities</option>${SEVERITIES.map(s=>'<option'+(state.fSev===s.name?" selected":"")+'>'+s.name+'</option>').join("")}</select>
    <select id="fStatus"><option value="">All statuses</option>${STATUS_FLOW.map(s=>'<option'+(state.fStatus===s?" selected":"")+'>'+s+'</option>').join("")}</select>
    <select id="fBrand"><option value="">All brands</option>${BRANDS.map(b=>'<option'+(state.fBrand===b.name?" selected":"")+'>'+b.name+'</option>').join("")}</select>
    <select id="fDept"><option value="">All departments</option>${DEPTS.map(d=>'<option'+(state.fDept===d?" selected":"")+'>'+d+'</option>').join("")}</select>
    <select id="fTool"><option value="">Any investigation</option>${Object.entries(TOOL_SHORT).map(([k,v])=>'<option value="'+k+'"'+(state.fTool===k?" selected":"")+'>'+v+'</option>').join("")}<option value="rca"${state.fTool==="rca"?" selected":""}>Has RCA</option></select>
    <button class="btn sm" id="clearf">Clear</button>
    <span class="spacer"></span><span class="muted" style="font-size:12.5px">${list.length} case${list.length===1?"":"s"}</span>
  </div>
  <div class="card">${caseTable(list)}</div>`;
}

/* ---------- case file ---------- */
function vCase(){
  const c = DB.cases.find(x=>x.id===state.caseId);
  if(!c) return '<div class="empty">Case not found.</div>';
  const s = slaState(c);
  const tabs=[["summary","Case summary"],["investigation","Investigation"],["capa","RCA & CAPA"],["comms","Communication"],["audit","Audit trail"]];
  return `
  <button class="btn sm" data-nav="queue" style="margin-bottom:14px">← Back to queue</button>
  <div class="casehead">
    <div style="flex:1;min-width:260px">
      <div class="caseid">${c.id} · ${esc(c.type)} · registered via ${esc(c.channel)}</div>
      <h2 style="margin:4px 0 7px">${esc(c.category)}</h2>
      <div class="row" style="gap:8px">
        <span class="pill ${STATUS_TONE[c.status]}">${esc(c.status)}</span>
        <span class="sev sev-${c.severity}"><i></i>${c.severity} · ${c.priority}</span>
        <span class="pill ${s.tone}">SLA ${s.label}</span>
        <span class="chip">Age ${ageLabel(c)}</span>
        ${waitingChip(c)}
        ${c.escalated?'<span class="pill p-crit">Escalated</span>':''}

      </div>
    </div>
  </div>
