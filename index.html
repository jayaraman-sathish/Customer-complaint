  <div class="casegrid">
    <div class="card pad">${caseTabBody(c)}</div>
    <div class="grid" style="gap:14px">${actionPanel(c)}${stagePanel(c)}</div>
  </div>`;
}

function caseTabBody(c){
  if(state.caseTab==="summary"){
    return `
    <div class="section"><h4>Complaint detail</h4>
      <p style="margin:0 0 12px;font-size:14px;line-height:1.6">${esc(c.description)}</p>
      ${c.rating?'<div class="row"><span class="muted" style="font-size:12px">Rating</span><span style="color:var(--copper-2);font-size:16px">'+"★".repeat(c.rating)+'<span style="color:var(--line)">'+"★".repeat(5-c.rating)+'</span></span></div>':''}
      ${c.evidence.length?'<div class="evidence" style="margin-top:10px">'+c.evidence.map(e=>'<div class="ev">'+(e.dataUrl?'<img src="'+e.dataUrl+'" alt="'+esc(e.name)+'">':'<div class="ph">'+(e.kind==="doc"?"▤":"▣")+'</div>')+'<div class="nm" title="'+esc(e.name)+'">'+esc(e.name)+'</div></div>').join("")+'</div>':'<div class="muted" style="font-size:12.5px">No evidence uploaded.</div>'}
    </div>
    <div class="section"><h4>Customer</h4><dl class="kv">
      <dt>Name</dt><dd>${esc(c.customer.name)}</dd>
      <dt>Mobile</dt><dd class="mono">${esc(c.customer.mobile)}</dd>
      <dt>Email</dt><dd>${esc(c.customer.email)}</dd>
      <dt>Location</dt><dd>${esc(c.customer.city)}, ${esc(c.customer.state)} — <span class="mono">${esc(c.customer.pin)}</span></dd>
    </dl></div>
    <div class="section"><h4>Product &amp; traceability</h4><dl class="kv">
      <dt>Brand</dt><dd>${esc(c.product.brand)} <span class="muted">(${esc(c.product.cat)})</span></dd>
      <dt>Variant / SKU</dt><dd>${esc(c.product.variant)} · <span class="mono">${esc(c.product.sku)}</span> · ${esc(c.product.pack)}</dd>
      <dt>Batch / lot</dt><dd class="mono">${esc(c.trace.batch)}</dd>
      <dt>Mfg. date</dt><dd>${fmtD(c.trace.mfgDate)}</dd>
      <dt>Bottling unit</dt><dd>${esc(c.trace.plant)}</dd>
    </dl></div>
    <div class="section"><h4>Purchase</h4><dl class="kv">
      <dt>Date</dt><dd>${fmtD(c.purchase.date)}</dd>
      <dt>Outlet</dt><dd>${esc(c.purchase.outlet)}</dd>
      <dt>Location</dt><dd>${esc(c.purchase.location)}</dd>
      <dt>Invoice ref.</dt><dd class="mono">${esc(c.purchase.invoice)}</dd>
    </dl></div>
    <div class="section"><h4>Repeats &amp; duplicates</h4>
      ${(()=>{
        const par=parentOf(c), dups=duplicatesOf(c.id), r=repeatsFor(c), fail=capaFailure(c);
        let out="";
        if(par) out+='<div class="callout crit">This case is a <b>duplicate</b> of <a href="#" data-case="'+par.id+'" class="mono">'+par.id+'</a> — the outcome recorded there applies here, and closing the parent closes this case too.</div>';
        if(dups.length) out+='<div class="callout">'+dups.length+' case'+(dups.length>1?"s":"")+' linked to this one as duplicate'+(dups.length>1?"s":"")+': '+dups.map(x=>'<a href="#" data-case="'+x.id+'" class="mono">'+x.id+'</a>').join(", ")+'. They close automatically when this case closes.</div>';
        if(fail) out+='<div class="callout crit"><b>Preventive action did not hold.</b> '+esc(fail.pa.action)+' was verified effective on <a href="#" data-case="'+fail.prev.id+'" class="mono">'+fail.prev.id+'</a>, and the same defect has recurred. Re-open the CAPA rather than repeating it.</div>';
        const grp=(title,list,note)=> list.length ? '<div class="rgrp"><div class="rgh">'+title+' <span class="rgn">'+list.length+'</span></div>'+
          '<div class="rgm">'+note+'</div>'+list.slice(0,6).map(x=>'<div class="rrow"><a href="#" data-case="'+x.id+'" class="mono">'+x.id+'</a>'+
            '<span class="pill '+STATUS_TONE[x.status]+'">'+esc(x.status)+'</span>'+
            '<span class="rd">'+fmtD(x.createdAt)+'</span>'+
            (x.rca?'<span class="rc" title="'+esc(x.rca.rootCause)+'">'+esc(x.rca.cause)+' cause</span>':'<span class="rc muted">no RCA</span>')+
          '</div>').join("")+'</div>' : '';
        out+=grp("Same batch", r.sameBatch, "Same lot — points at one production window.");
        out+=grp("Same defect, other batches", r.sameDefect, "Same SKU and category — points at a systemic cause.");
        out+=grp("Same defect at this unit", r.samePlant, "Other products, same bottling unit and defect type.");
        if(!out) out='<div class="muted" style="font-size:12.5px">No earlier cases on batch '+esc(c.trace.batch)+', and no prior '+esc(c.category).toLowerCase()+' on '+esc(c.product.sku)+'. This is the first of its kind.</div>';
        return out;
      })()}
    </div>
    <div class="section"><h4>Customer confirmation</h4>
      ${c.customerResponse
        ? '<div class="note"><div class="h"><span class="pill '+(c.customerResponse.status==="Confirmed"?"p-ok":"p-crit")+'">'+esc(c.customerResponse.status)+'</span><b>'+esc(c.customer.name)+'</b><span>'+fmtDT(c.customerResponse.at)+'</span></div>'+(c.customerResponse.comment?'<div class="b">'+esc(c.customerResponse.comment)+'</div>':'<div class="b muted">No comment left.</div>')+'</div>'
        : (c.status==="Resolved" ? '<div class="stagenote">The outcome is published to the consumer’s status page. Waiting for them to confirm or dispute it — Customer Care can close without a response if needed.</div>'
           : '<div class="muted" style="font-size:12.5px">Nothing to confirm yet — the consumer sees the outcome once the case is resolved.</div>')}
    </div>`;
  }
  if(state.caseTab==="investigation"){
    const tool = state.invTool || "note";
    const whoCan = USERS.filter(u=>u.active&&(ROLES[u.role]||[]).includes("investigate")).map(u=>u.name).join(", ");
    return `<div class="section"><h4>Investigation record</h4>
      ${c.investigation.length? c.investigation.map((n,i)=>renderInv(n,i)).join("")
       :'<div class="muted" style="font-size:12.5px">No investigation entries yet.</div>'}
    </div>
    ${can("investigate") ? `<div class="section"><h4>Add investigation entry</h4>
      <div class="toolbar">${Object.entries(INV_TOOLS).map(([k,t])=>'<button class="toolbtn" data-tool="'+k+'" aria-pressed="'+(tool===k)+'"><b>'+t.name+'</b><small>'+t.hint+'</small></button>').join("")}</div>
      <div id="invform" style="margin-top:14px">${invForm(tool)}</div>
      <div class="field" style="margin-top:12px"><label for="invfiles">Attachments (lab report, line log, photos)</label>
        <input type="file" id="invfiles" multiple accept="image/*,.pdf,.xlsx,.csv,.docx">
        ${state.invFiles&&state.invFiles.length?'<div class="evidence" style="margin-top:8px">'+state.invFiles.map(f=>'<div class="ev">'+(f.dataUrl?'<img src="'+f.dataUrl+'" alt="">':'<div class="ph">▤</div>')+'<div class="nm" title="'+esc(f.name)+'">'+esc(f.name)+'</div></div>').join("")+'</div>':''}
      </div>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="addinv">Record ${esc(INV_TOOLS[tool].name)}</button>
        <span class="muted" style="font-size:11.5px">Entries are timestamped and cannot be edited afterwards.</span></div>
    </div>`
    : `<div class="denied" style="margin-top:12px"><b>${esc(state.role)} cannot record investigation findings.</b> ${c.assignee===state.user?'This case is assigned to you, but findings are recorded by a QA/QC or plant user — reassign it from the Case summary tab.':'This case is with <b>'+esc(c.assignee||"nobody yet")+'</b>.'} Users who can investigate: ${esc(whoCan)}. In this demo, switch user from the "Signed in as" menu at the top.</div>`}`;
  }
  if(state.caseTab==="capa"){
    return `
    <div class="section"><h4>Root cause analysis</h4>
      ${c.rca? '<div class="note"><div class="h"><b>'+esc(c.rca.by)+'</b><span>'+fmtDT(c.rca.at)+'</span><span class="pill p-info">'+esc(c.rca.cause)+'</span>'+rcaReviewPill(c)+'</div><div class="b">'+esc(c.rca.rootCause)+'</div>'
          +(c.rca.review?'<div class="muted" style="font-size:12px;margin-top:6px">Review by '+esc(c.rca.review.by)+' · '+fmtDT(c.rca.review.at)+(c.rca.review.comment?': “'+esc(c.rca.review.comment)+'”':'')+'</div>':'')+'</div>'
       : '<div class="muted" style="font-size:12.5px">Root cause not yet documented.</div>'}
      ${can("rca") && rcaOpen(c) ? `<div class="field" style="margin-top:12px"><label for="rcatext">${c.rca?"Revise root cause":"Document root cause"}</label>
        <textarea id="rcatext" placeholder="State the verified root cause, not the symptom.">${c.rca?esc(c.rca.rootCause):esc(state.rcaPrefill||"")}</textarea>
        <div class="row" style="margin-top:8px">
          <select id="rcacause" style="border:1px solid var(--line);border-radius:6px;padding:6px 9px">${["Process","Equipment","Material","External"].map(k=>'<option'+(c.rca&&c.rca.cause===k?" selected":"")+'>'+k+'</option>').join("")}</select>
          <button class="btn primary" id="saverca">Save RCA</button>
          ${c.rca&&c.rca.review?'<span class="muted" style="font-size:11.5px">Saving again resets the review.</span>':''}</div></div>` : ''}
      ${!rcaOpen(c) ? '<div class="stagenote" style="margin-top:10px">The case has moved past RCA &amp; CAPA — the root cause is locked. The QA Manager can return it for rework from the approval panel.</div>' : ''}
      ${c.rca && can("approve") && rcaOpen(c) && !(c.rca.review&&c.rca.review.status==="Reviewed") ? `<div class="actionbox" style="margin-top:12px"><h4>RCA review · QA Manager</h4>
        <div class="stagenote">Check that the stated cause is verified by evidence (retained sample, line data, supplier lot) and is a cause, not a symptom.</div>
        <div class="field"><label for="rcareview">Review comment</label><textarea id="rcareview" style="min-height:56px" placeholder="e.g. Verified against torque log for the shift."></textarea></div>
        <div class="row" style="margin-top:8px"><button class="btn primary" id="rcaApprove">Mark RCA reviewed</button><button class="btn" id="rcaReturn">Return for rework</button></div></div>` : ''}
      ${c.rca && !can("approve") && !(c.rca.review&&c.rca.review.status==="Reviewed") ? '<div class="stagenote" style="margin-top:10px">Awaiting RCA review by the QA Manager before the case can be submitted for approval.</div>':''}
    </div>
    <div class="section"><h4>Corrective &amp; preventive actions</h4>
      ${c.capa.length? c.capa.map((a,i)=>{
        const overdue = a.status!=="Completed" && new Date(a.target) < NOW;
        return '<div class="capa"><div class="top"><span class="pill '+(a.kind==="CA"?"p-info":"p-new")+'">'+a.kind+'</span>'+
          '<span class="pill '+(a.status==="Completed"?"p-ok":a.status==="In Progress"?"p-warn":"p-mute")+'">'+a.status+'</span>'+
          (overdue?'<span class="pill p-crit">Overdue</span>':'')+
          (a.status==="Completed"&&!a.effectiveness?'<span class="pill p-warn">Effectiveness not verified</span>':'')+
          (a.effectiveness?'<span class="pill p-ok">Effective</span>':'')+
          '<span class="spacer" style="flex:1"></span>'+
          (can("capa")&&a.status!=="Completed"&&rcaOpen(c)?'<button class="btn sm" data-advance="'+i+'">'+(a.status==="Open"?"Start":"Mark complete")+'</button>':'')+
          (can("approve")&&a.status==="Completed"&&!a.effectiveness?'<button class="btn sm" data-verify="'+i+'">Verify effectiveness</button>':'')+
          '</div><div style="font-size:13.5px">'+esc(a.action)+'</div>'+
          '<div class="meta"><span>Owner: <b>'+esc(a.owner)+'</b></span><span>Target: <span class="mono">'+fmtD(a.target)+'</span></span>'+
          (a.effectiveness?'<span>Effectiveness: '+esc(a.effectiveness)+'</span>':'')+'</div></div>';
      }).join("") : '<div class="muted" style="font-size:12.5px">No actions raised yet.</div>'}
      ${can("capa") && rcaOpen(c) ? `<div class="grid" style="grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
        <div class="field"><label>Action type</label><select id="capakind"><option value="CA">Corrective action (CA)</option><option value="PA">Preventive action (PA)</option></select></div>
        <div class="field"><label>Owner</label><select id="capaowner">${USERS.filter(u=>u.active&&u.role!=="Management (read-only)").map(u=>'<option>'+esc(u.name)+'</option>').join("")}</select></div>
        <div class="field" style="grid-column:1/-1"><label>Action</label><textarea id="capatext" placeholder="What will be done, on which line, to which lot…"></textarea></div>
        <div class="field"><label>Target date</label><input type="date" id="capatarget" value="${new Date(addH(NOW,24*14)).toISOString().slice(0,10)}"></div>
        <div class="field" style="justify-content:flex-end"><button class="btn primary" id="addcapa">Raise action</button></div>
      </div>` : (rcaOpen(c) ? '<div class="denied" style="margin-top:12px">Raising CAPA requires a QA/QC, Plant or QA Manager role.</div>' : '')}
    </div>`;
  }
  if(state.caseTab==="comms"){
    return `<div class="section"><h4>Notification outbox</h4>
      <div class="stagenote">Simulated SMTP outbox. Templates are configurable under Masters &amp; Admin → Notification templates.</div>
      ${c.outbox.length? c.outbox.slice().reverse().map(m=>'<div class="note"><div class="h"><span class="pill p-mute">'+esc(m.key)+'</span><b>'+esc(m.to)+'</b><span>'+fmtDT(m.at)+'</span></div><div class="b"><b>'+esc(m.subject)+'</b><div class="muted" style="white-space:pre-wrap;font-size:12.5px;margin-top:4px">'+esc(m.body)+'</div></div></div>').join("")
       : '<div class="muted" style="font-size:12.5px">No messages sent.</div>'}
    </div>`;
  }
  return `<div class="section"><h4>Audit trail</h4>
    <div class="stagenote">Every status change, assignment and user action is retained with an immutable timestamp.</div>
    ${c.audit.slice().reverse().map(a=>'<div class="note"><div class="h"><b>'+esc(a.action)+'</b><span>'+fmtDT(a.at)+'</span><span>'+esc(a.by)+'</span></div>'+(a.detail?'<div class="b">'+esc(a.detail)+'</div>':'')+'</div>').join("")}
  </div>`;
}

function stagePanel(c){
  const si = STATUS_FLOW.indexOf(c.status);
  return '<div class="card pad"><h4 style="font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin-bottom:12px">Workflow stage</h4>'+
    '<div class="timeline">'+STATUS_FLOW.map((s,i)=>{
      const cls = i<si?"done":i===si?"now":"";
      const CAND={0:["Registered"],1:["Classified"],2:["Assigned"],3:["Status → RCA & CAPA","RCA recorded"],4:["Status → Pending Approval"],5:["Resolved"],6:["Closed"]};
      const hit = c.audit.find(a=>(CAND[i]||[]).includes(a.action));
      const when = hit ? '<div class="m mono">'+fmtDT(hit.at)+'</div>' : (i<si?'<div class="m">completed</div>':'');
      const extra = i===2&&c.assignee&&i<=si ? '<div class="m">'+esc(c.assignee)+' · '+esc(c.department||"")+'</div>' : '';
      return '<div class="tl '+cls+'"><div class="mk">'+(i<si?"✓":i+1)+'</div><div><div class="t">'+s+'</div>'+
        (i<si?when+extra : i===si ? (when||'<div class="m">current stage</div>')+extra : '<div class="m">pending</div>')+'</div></div>';
    }).join("")+'</div>'+
    '<div class="stagenote" style="margin:12px 0 0;border-top:1px solid var(--line-2);padding-top:10px">'+esc(sevOf(c.severity).note)+'<br><b>Response SLA</b> '+sevOf(c.severity).respHrs+' h · <b>Resolution SLA</b> '+sevOf(c.severity).resHrs+' h · due <span class="mono">'+fmtD(dueAt(c))+'</span></div></div>';
}

function actionPanel(c){
  const A=[];
  if(c.status==="Closed"||c.status==="Rejected") A.push('<div class="stagenote">This case is closed. Reopening requires a System Administrator.</div>');
  if(c.status==="New"){
    if(can("triage")){
      A.push(`<div class="field"><label class="req">Classify as</label><select id="tType"><option>Complaint</option><option${c.type==="Feedback"?" selected":""}>Feedback</option></select></div>
      <div class="field"><label class="req">Category</label><select id="tCat">${CATEGORIES.map(x=>'<option'+(x.name===c.category?" selected":"")+'>'+esc(x.name)+'</option>').join("")}</select></div>
      <div class="field"><label class="req">Severity</label><select id="tSev">${SEVERITIES.map(s=>'<option'+(s.name===c.severity?" selected":"")+'>'+s.name+'</option>').join("")}</select></div>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="doTriage">Classify case</button></div>
      ${(()=>{ const cand=dupCandidates(c); return cand.length ? `<div class="field" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">
        <label for="dupOf">Or link as a duplicate of</label>
        <select id="dupOf">${cand.slice(0,12).map(x=>'<option value="'+x.id+'">'+x.id+' — '+esc(x.category)+' · '+esc(x.trace.batch)+'</option>').join("")}</select>
        <span class="hint">Use this when the same consumer or the same bottle has already been logged. A second consumer with the same defect is a repeat, not a duplicate — leave it open.</span>
        <button class="btn danger sm" id="doDup" style="margin-top:8px;align-self:flex-start">Mark as duplicate</button></div>` : ''; })()}`);
    } else A.push('<div class="denied">Classification requires a Customer Care or QA Manager role.</div>');
  }
  else if(c.status==="Classified"||(!c.assignee && c.status!=="Closed")){
    if(can("assign")){
      const dept = state.assignDept || c.department || catOf(c.category)?.dept || DEPTS[0];
      const pool = investigators(dept);
      A.push(`<div class="field"><label class="req">Department</label><select id="aDept">${DEPTS.map(d=>'<option'+(d===dept?" selected":"")+'>'+esc(d)+'</option>').join("")}</select></div>
      <div class="field"><label class="req">Assign to</label>
        <select id="aUser"${pool.length?"":" disabled"}>${pool.length?pool.map(u=>'<option>'+esc(u.name)+' — '+esc(u.role)+'</option>').join(""):'<option>No investigator in this department</option>'}</select>
        <span class="hint">Only users who can record findings are listed. ${esc(dept)} has ${pool.length} investigator${pool.length===1?"":"s"}.</span></div>
      <button class="btn primary" id="doAssign" style="margin-top:10px"${pool.length?"":" disabled"}>Assign &amp; start investigation</button>
      ${pool.length?"":'<div class="stagenote" style="margin-top:8px">Pick another department, or add an investigator under Masters &amp; Admin → Users.</div>'}`);
    } else A.push('<div class="denied">Assignment requires a Customer Care or QA Manager role.</div>');
  }
  else if(c.status==="Under Investigation"){
    A.push('<div class="stagenote">Record findings under the Investigation tab, then move the case to RCA &amp; CAPA.</div>');
    if(can("investigate")) A.push('<button class="btn primary" id="toRCA"'+(c.investigation.length?"":" disabled")+'>Move to RCA &amp; CAPA</button>'+(c.investigation.length?'':'<div class="stagenote" style="margin-top:8px">At least one investigation note is required.</div>'));
    else A.push('<div class="denied">Findings are recorded by the assigned investigator'+(c.assignee?' (<b>'+esc(c.assignee)+'</b>)':'')+'. Customer Care can escalate or communicate with the customer meanwhile.</div>');
  }
  else if(c.status==="RCA & CAPA"){
    const reviewed = c.rca && c.rca.review && c.rca.review.status==="Reviewed";
    const ready = reviewed && c.capa.length;
    A.push('<div class="stagenote">Document the root cause, get it reviewed by the QA Manager, and raise at least one action before requesting approval.</div>');
    A.push('<div class="checks">'+[["Root cause documented",!!c.rca],["RCA reviewed by QA Manager",!!reviewed],["At least one CA / PA raised",c.capa.length>0]].map(x=>'<div class="'+(x[1]?"on":"")+'"><i>'+(x[1]?"✓":"○")+'</i>'+x[0]+'</div>').join("")+'</div>');
    if(can("rca")) A.push('<button class="btn primary" id="toApproval"'+(ready?"":" disabled")+' style="margin-top:10px">Submit for approval</button>');
    else A.push('<div class="denied">RCA entry is restricted to QA/QC users and above.</div>');
  }
  else if(c.status==="Pending Approval"){
    if(can("approve")){
      A.push(`<div class="field"><label class="req">Resolution communicated to customer</label><textarea id="resText" placeholder="Plain-language outcome the customer will receive."></textarea></div>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="doResolve">Approve &amp; resolve</button><button class="btn" id="doReturn">Return to QA</button></div>`);
    } else A.push('<div class="denied">Approval is restricted to the QA Manager.</div>');
  }
  else if(c.status==="Resolved"){
    if(can("close")){
      const cr=c.customerResponse;
      if(cr&&cr.status==="Disputed") A.push('<div class="denied"><b>The consumer disputed this outcome</b> on '+fmtD(cr.at)+(cr.comment?': “'+esc(cr.comment)+'”':'.')+' Re-open the investigation rather than closing.</div><button class="btn" id="reopen" style="margin-bottom:8px">Re-open investigation</button>');
      else if(cr) A.push('<div class="owner me"><b>Consumer confirmed the outcome</b> on '+fmtD(cr.at)+'.</div>');
      else A.push('<div class="stagenote">No consumer response yet — they can confirm from their status page. Close without it only if they cannot be reached.</div>');
      A.push('<label class="row" style="gap:7px;font-size:13px;margin:0 0 10px"><input type="checkbox" id="custConf"'+(cr&&cr.status==="Confirmed"?" checked":"")+'> Customer confirmation received</label><button class="btn primary" id="doClose">Close case</button>');
    }
    else A.push('<div class="denied">Closure is handled by Customer Care or the QA Manager.</div>');
  }
  const extra=[];
  if(!["Closed","Rejected","Duplicate"].includes(c.status)){
    if(can("escalate")) extra.push('<button class="btn sm" id="doEsc">'+(c.escalated?"Withdraw escalation":"Escalate")+'</button>');
    if(can("hold")) extra.push('<button class="btn sm" id="doHold">'+(c.hold?"Release batch hold":"Place batch on hold")+'</button>');
  }
  const nt=nextTask(c);
  const owns = nt && nt.who.includes(state.user);
  const banner = nt ? '<div class="owner '+(owns?"me":"")+'">'+(owns?'<b>This is your action.</b> ':'<b>Waiting on '+esc(nt.who.join(", "))+'.</b> ')+esc(nt.what)+'.</div>' : '';
  return '<div class="actionbox"><h4>Next action · '+esc(c.status)+'</h4>'+banner+A.join("")+
    (extra.length?'<div class="row" style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">'+extra.join("")+'</div>':'')+'</div>';
}


function vTasks(){
  const cases=myCaseTasks(), capa=myCapaTasks();
  const mine=DB.cases.filter(c=>c.assignee===state.user&&!["Closed","Rejected","Duplicate"].includes(c.status));
  const overdue=capa.filter(x=>new Date(x.a.target)<NOW).length;
  const sec=(title,sub,body)=>'<div class="card" style="margin-bottom:16px"><div class="panelhead" style="padding-bottom:10px"><h3>'+title+'</h3><span class="sub">'+sub+'</span></div>'+body+'</div>';
  const taskRows = cases.length ? '<div class="tasklist">'+cases.sort((a,b)=>ageH(b.c)-ageH(a.c)).map(({c,t})=>{
      const s=slaState(c);
      return '<div class="task" data-task="'+c.id+'|'+t.tab+'">'+
        '<div class="tw"><span class="pill '+STATUS_TONE[c.status]+'">'+esc(c.status)+'</span>'+
          '<span class="sev sev-'+c.severity+'"><i></i>'+c.severity+'</span>'+
          (c.escalated?'<span class="pill p-crit">ESC</span>':'')+
          '<span class="pill '+s.tone+'">'+s.label+'</span></div>'+
        '<div class="tt">'+esc(t.what)+'</div>'+
        '<div class="tm"><span class="mono" style="color:var(--copper)">'+c.id+'</span> · '+esc(c.product.brand)+' · '+esc(c.category)+
          (t.who.length>1?' · <span class="muted">shared with '+(t.who.length-1)+' other'+(t.who.length>2?"s":"")+'</span>':'')+'</div>'+
      '</div>'; }).join("")+'</div>'
    : '<div class="empty">Nothing is waiting on you right now.</div>';

  const capaRows = capa.length ? '<div class="tasklist">'+capa.sort((a,b)=>new Date(a.a.target)-new Date(b.a.target)).map(x=>{ const {c,a,i}=x;
      const od=new Date(a.target)<NOW;
      return '<div class="task" data-task="'+c.id+'|capa">'+
        '<div class="tw"><span class="pill '+(a.kind==="CA"?"p-info":"p-new")+'">'+a.kind+'</span>'+
          '<span class="pill '+(a.status==="In Progress"?"p-warn":"p-mute")+'">'+a.status+'</span>'+
          (od?'<span class="pill p-crit">Overdue</span>':'<span class="pill p-ok">Due '+fmtD(a.target)+'</span>')+'</div>'+
        '<div class="tt">'+esc(a.action)+'</div>'+
        '<div class="tm" style="color:var(--copper)">'+esc(x.job||"Complete this action")+'</div>'+
        '<div class="tm"><span class="mono" style="color:var(--copper)">'+c.id+'</span> · '+esc(c.product.brand)+' · '+esc(c.trace.batch)+'</div>'+
      '</div>'; }).join("")+'</div>'
    : '<div class="empty">No open actions assigned to you.</div>';

  return `
  <div class="kpis" style="margin-bottom:16px">
    <div class="kpi"><span class="v">${cases.length}</span><span class="l">Cases awaiting your action</span></div>
    <div class="kpi"><span class="v">${capa.length}</span><span class="l">CAPA actions on you</span></div>
    <div class="kpi ${overdue?"alert":""}"><span class="v">${overdue}</span><span class="l">Past target date</span></div>
    <div class="kpi"><span class="v">${mine.length}</span><span class="l">Open cases assigned to you</span></div>
  </div>
  <p class="muted" style="font-size:12.5px;margin:0 0 14px">Showing work for <b>${esc(state.user)}</b> — ${esc(state.role)}. Switch user from the menu above to see another person's queue.</p>
  ${sec("Waiting on you","the next step on each case",taskRows)}
  ${sec("Your corrective &amp; preventive actions","raised on cases you may not own",capaRows)}`;
}

/* ---------- CAPA tracker ---------- */
function vCapa(){
  const rows=[];
  DB.cases.forEach(c=>c.capa.forEach((a,i)=>rows.push({c,a,i})));
  const open = rows.filter(r=>r.a.status!=="Completed");
  const overdue = open.filter(r=>new Date(r.a.target)<NOW);
  rows.sort((x,y)=> new Date(x.a.target)-new Date(y.a.target));
  const byOwner = [...new Set(rows.map(r=>r.a.owner))].map(o=>({label:o, value:rows.filter(r=>r.a.owner===o&&r.a.status!=="Completed").length})).filter(x=>x.value).sort((a,b)=>b.value-a.value);
  return `
  <div class="kpis" style="margin-bottom:16px">
    <div class="kpi"><span class="v">${rows.length}</span><span class="l">Total actions raised</span></div>
    <div class="kpi"><span class="v">${open.length}</span><span class="l">Open / in progress</span></div>
    <div class="kpi ${overdue.length?"alert":""}"><span class="v">${overdue.length}</span><span class="l">Past target date</span></div>
    <div class="kpi"><span class="v">${rows.filter(r=>r.a.effectiveness).length}</span><span class="l">Effectiveness verified</span></div>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:16px">
    <div class="card"><div class="panelhead"><h3>Open actions by owner</h3></div>${barList(byOwner)}</div>
    <div class="card"><div class="panelhead"><h3>Action mix</h3></div>${barList([
      {label:"Corrective (CA)", value:rows.filter(r=>r.a.kind==="CA").length},
      {label:"Preventive (PA)", value:rows.filter(r=>r.a.kind==="PA").length, color:"var(--info)"}])}</div>
  </div>
  <div class="card"><div class="tablewrap" style="border:none">
    <table><thead><tr><th>Case</th><th>Type</th><th>Action</th><th>Owner</th><th>Target</th><th>Status</th></tr></thead><tbody>
    ${rows.map(r=>{
      const od = r.a.status!=="Completed" && new Date(r.a.target)<NOW;
      return '<tr class="clickable" data-case="'+r.c.id+'"><td><span class="mono" style="color:var(--copper)">'+r.c.id+'</span><div class="muted" style="font-size:11px">'+esc(r.c.product.brand)+'</div></td>'+
      '<td><span class="pill '+(r.a.kind==="CA"?"p-info":"p-new")+'">'+r.a.kind+'</span></td>'+
      '<td style="max-width:360px">'+esc(r.a.action)+'</td><td>'+esc(r.a.owner)+'</td>'+
      '<td class="mono">'+fmtD(r.a.target)+(od?' <span class="pill p-crit">Overdue</span>':'')+'</td>'+
      '<td><span class="pill '+(r.a.status==="Completed"?"p-ok":r.a.status==="In Progress"?"p-warn":"p-mute")+'">'+r.a.status+'</span></td></tr>';
    }).join("")}
    </tbody></table></div></div>`;
}

/* ---------- reports ---------- */
const REPORTS = {
  overview:{t:"Complaint overview", cols:["Reference","Type","Registered","Brand","Category","Severity","Status","Owner","Age","SLA"],
    rows:()=>DB.cases.map(c=>[c.id,c.type,fmtD(c.createdAt),c.product.brand,c.category,c.severity,c.status,c.assignee||"—",ageLabel(c),slaState(c).label])},
  brand:{t:"Brand / SKU-wise analysis", cols:["Brand","SKU","Pack","Complaints","Critical","Open","Closed"],
    rows:()=>BRANDS.flatMap(b=>b.variants.map(v=>{ const l=DB.cases.filter(c=>c.type==="Complaint"&&c.product.sku===v.sku);
      return [b.name,v.sku,v.pack,l.length,l.filter(c=>c.severity==="Critical").length,l.filter(c=>!["Closed","Rejected"].includes(c.status)).length,l.filter(c=>c.status==="Closed").length]; }))},
  category:{t:"Category &amp; severity analysis", cols:["Category","Owning dept.","Total","Critical","Major","Minor","Open"],
    rows:()=>CATEGORIES.map(k=>{ const l=DB.cases.filter(c=>c.category===k.name);
      return [k.name,k.dept,l.length,l.filter(c=>c.severity==="Critical").length,l.filter(c=>c.severity==="Major").length,l.filter(c=>c.severity==="Minor").length,l.filter(c=>!["Closed","Rejected"].includes(c.status)).length]; })},
  batch:{t:"Batch / plant-wise traceability", cols:["Bottling unit","Batch / lot","Brand","Cases","Highest severity","Open"],
    rows:()=>{ const m={}; DB.cases.filter(c=>c.type==="Complaint").forEach(c=>{ const k=c.trace.plant+"|"+c.trace.batch; (m[k]=m[k]||[]).push(c); });
      return Object.entries(m).map(([k,l])=>{ const [p,b]=k.split("|"); const order={Critical:3,Major:2,Minor:1};
        return [p,b,l[0].product.brand,l.length,l.reduce((h,c)=>order[c.severity]>order[h]?c.severity:h,"Minor"),l.filter(c=>!["Closed","Rejected"].includes(c.status)).length]; }).sort((a,b)=>b[3]-a[3]); }},
  sla:{t:"SLA performance &amp; ageing", cols:["Severity","Response SLA (h)","Resolution SLA (h)","Cases","Closed within SLA","Breached","Compliance"],
    rows:()=>SEVERITIES.map(s=>{ const l=DB.cases.filter(c=>c.type==="Complaint"&&c.severity===s.name);
      const cl=l.filter(c=>c.status==="Closed"); const met=cl.filter(c=>slaState(c).label==="Met").length;
      const br=l.filter(c=>slaState(c).tone==="p-crit").length;
      return [s.name,s.respHrs,s.resHrs,l.length,met,br,cl.length?Math.round(met/cl.length*100)+"%":"—"]; })},
  repeat:{t:"Repeats &amp; recurrence", cols:["Brand / SKU","Category","Cases","Batches affected","Latest","Prior RCA cause","Recurred after PA"],
    rows:()=>{ const m={};
      DB.cases.filter(c=>c.type==="Complaint"&&!c.duplicateOf).forEach(c=>{ const k=c.product.sku+"|"+c.category; (m[k]=m[k]||[]).push(c); });
      return Object.entries(m).filter(([,l])=>l.length>1).map(([k,l])=>{ const [sku,cat]=k.split("|");
        const batches=[...new Set(l.map(c=>c.trace.batch))];
        const latest=l.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))[0];
        const causes=[...new Set(l.filter(c=>c.rca).map(c=>c.rca.cause))];
        const fail=l.some(c=>capaFailure(c));
        return [l[0].product.brand+" · "+sku, cat, l.length, batches.length, fmtD(latest.createdAt), causes.join(", ")||"—", fail?"Yes":"No"]; })
        .sort((a,b)=>b[2]-a[2]); }},
  duplicate:{t:"Duplicate links", cols:["Duplicate","Parent case","Brand / SKU","Category","Batch","Logged"],
    rows:()=>DB.cases.filter(c=>c.duplicateOf).map(c=>[c.id, c.duplicateOf, c.product.brand+" · "+c.product.sku, c.category, c.trace.batch, fmtD(c.createdAt)])},
  rca:{t:"Root cause trend", cols:["Cause group","Cases","Actions raised","Completed","Open"],
    rows:()=>["Process","Equipment","Material","External"].map(k=>{ const l=DB.cases.filter(c=>c.rca&&c.rca.cause===k);
      const a=l.flatMap(c=>c.capa); return [k,l.length,a.length,a.filter(x=>x.status==="Completed").length,a.filter(x=>x.status!=="Completed").length]; })}
};

function confirmUI(r, wide){
  if(r.status!=="Resolved") return '';
  if(r.customerResponse) return '<div class="cresp '+(r.customerResponse.status==="Confirmed"?"ok":"no")+'">'+
    (r.customerResponse.status==="Confirmed"?"✓ You confirmed this outcome on ":"You told us this is not resolved — ")+fmtD(r.customerResponse.at)+
    (r.customerResponse.status==="Disputed"?". Our quality team has re-opened the case.":". Thank you.")+'</div>';
  return '<div class="confirmbox"><div class="ch">Does this resolve your complaint?</div>'+
    '<textarea id="crComment" placeholder="Anything you would like to add (optional)"></textarea>'+
    '<div class="crow"><button class="btn primary sm" data-cresp="'+r.id+'|Confirmed">Yes, this resolves it</button>'+

function customerRespond(id, status){
  const c=DB.cases.find(x=>x.id===id); if(!c) return;
  const el=$("#crComment"); const comment=el?el.value.trim():"";
  c.customerResponse={status, at:iso(NOW), comment};
  const e={at:iso(NOW), by:c.customer.name+" (consumer)", action:status==="Confirmed"?"Customer confirmed outcome":"Customer disputed outcome", detail:comment};
  c.audit.push(e); DB.audit.unshift(Object.assign({ref:c.id}, e));
  if(status==="Disputed"){ c.status="Under Investigation"; c.resolution=null; c.escalated=true;
    const e2={at:iso(NOW), by:"System", action:"Re-opened", detail:"Consumer disputed the outcome; case escalated"};
    c.audit.push(e2); DB.audit.unshift(Object.assign({ref:c.id}, e2)); }
  save(); render();
  toast(status==="Confirmed"?"Thank you — your confirmation is recorded.":"We have re-opened your case.");
}

function portalFoot(){

document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-nav],[data-case],[data-qtab],[data-ctab],[data-atab],[data-report],[data-pstep],[data-pnav],[data-sku],[data-star],[data-advance],[data-verify],[data-cresp],[data-task],[data-tool],[data-userc],button");
  if(!t) return;

  if(t.dataset.nav){ go(t.dataset.nav); return; }

  if(t.dataset.task){ const [id,tab]=t.dataset.task.split("|"); state.caseId=id; state.caseTab=tab; state.view="case"; render(); return; }
  if(t.dataset.qtab){ state.queueTab=t.dataset.qtab; render(); return; }

  if(t.dataset.sku){ state.portal.sku=t.dataset.sku; render(); return; }
  if(t.dataset.cresp){ const [id,st]=t.dataset.cresp.split("|"); customerRespond(id,st); return; }
  if(t.dataset.tool){ state.invTool=t.dataset.tool; render(); return; }
  if(t.dataset.userc!=null){ const cc=DB.cases.find(x=>x.id===state.caseId); const n=cc&&cc.investigation[+t.dataset.userc]; if(n){ state.rcaPrefill=(n.data&&(n.data.conclusion||n.data.likely))||n.text; state.caseTab="capa"; render(); toast("Copied into the root-cause field — review and save."); } return; }

  const id=t.id;
  if(id==="themebtn"){ const r=document.documentElement; const cur=r.getAttribute("data-theme");
    const dark = cur ? cur==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark?"light":"dark"); return; }
  if(id==="resetbtn"){ seed(); state.caseId=null; state.view="dashboard"; render(); toast("Demo data restored."); return; }
  if(id==="clearf"){ state.q="";state.fSev="";state.fStatus="";state.fBrand="";state.fDept="";state.fTool=""; render(); return; }
  if(id==="copycsv"){ copyCsv(); return; }
  if(id==="printrep"){ window.print(); return; }
  if(id==="addcat"){ addCategory(); return; }
  if(id==="doTrack"){ doTrackPanel(); return; }
  if(id==="qrbox"||id==="simscan"){ const m=skuMeta(state.portal.sku); scan(m.v.sku, batchFor(m), id==="simscan"); return; }

  /* portal */
  if(t.dataset.pstep){ startPortalStep(t.dataset.pstep); return; }
  if(t.dataset.star){ state.portal.data.rating = +t.dataset.star; render(); return; }
  if(t.dataset.pnav){ portalNav(t.dataset.pnav); return; }
  if(t.dataset.advance!=null){ advanceCapa(+t.dataset.advance); return; }
  if(t.dataset.verify!=null){ verifyCapa(+t.dataset.verify); return; }

  /* case actions */
  const c = DB.cases.find(x=>x.id===state.caseId);
  if(!c) return;
  const A={ doTriage:()=>doTriage(c), doDup:()=>doDup(c), doAssign:()=>doAssign(c), toRCA:()=>moveStatus(c,"RCA & CAPA","Investigation complete"),
    addinv:()=>addInv(c), saverca:()=>saveRca(c), rcaApprove:()=>reviewRca(c,true), rcaReturn:()=>reviewRca(c,false), addcapa:()=>addCapa(c), toApproval:()=>moveStatus(c,"Pending Approval","Submitted for QA Manager approval"),
    doResolve:()=>doResolve(c), doReturn:()=>moveStatus(c,"RCA & CAPA","Returned to QA for rework"), doClose:()=>doClose(c),
    reopen:()=>{ c.status="Under Investigation"; c.resolution=null; log(c,"Re-opened","Consumer disputed the outcome"); commit("Case re-opened for further investigation."); },
    doEsc:()=>{ c.escalated=!c.escalated; log(c, c.escalated?"Escalated":"Escalation withdrawn",""); if(c.escalated) mail(c,"ESCALATE"); commit(c.escalated?"Case escalated.":"Escalation withdrawn."); },
    doHold:()=>{ c.hold=!c.hold; log(c, c.hold?"Batch placed on hold":"Batch hold released", c.trace.batch); commit(c.hold?"Batch "+c.trace.batch+" placed on hold.":"Batch hold released."); } };
  if(A[id]) A[id]();
});

});

/* ---------- actions ---------- */
function commit(msg){ save(); render(); if(msg) toast(msg); }
function moveStatus(c, s, detail){ c.status=s; log(c,"Status → "+s, detail||""); commit("Moved to "+s+"."); }

function doTriage(c){
  c.type=$("#tType").value; c.category=$("#tCat").value; c.severity=$("#tSev").value;
  c.priority = c.severity==="Critical"?"P1":c.severity==="Major"?"P2":"P3";
  c.department = catOf(c.category)?.dept || null;
  c.status="Classified";
  log(c,"Classified",c.category+" / "+c.severity+" ("+c.type+")");
  commit("Case classified as "+c.severity+".");
}
function doDup(c){
  const parent=$("#dupOf")?$("#dupOf").value:null;
  if(!parent) return toast("No parent case to link to.");
  c.duplicateOf=parent; c.status="Duplicate";
  log(c,"Marked duplicate","Linked to "+parent);
  const par=DB.cases.find(x=>x.id===parent);
  if(par) log(par,"Duplicate linked", c.id+" recorded as a duplicate of this case");
  commit("Linked as a duplicate of "+parent+".");
}
function doAssign(c){
  c.department=$("#aDept").value;
  c.assignee=$("#aUser").value.split(" — ")[0];
  if(!USERS.some(u=>u.name===c.assignee&&canInvestigate(u))) return toast("Pick a user who can investigate.");
  state.assignDept=null;
  c.status="Under Investigation";
  log(c,"Assigned","Routed to "+c.department+" — "+c.assignee);
  mail(c,"ASSIGN");
  commit("Assigned to "+c.assignee+" — investigation started.");
}
function addInv(c){
  const tool = state.invTool || "note";
  const g = id => { const el=$("#"+id); return el ? el.value.trim() : ""; };
  let data={}, text="";
  if(tool==="note"){ text=g("inv_text"); if(!text) return toast("Enter your findings first."); }
  if(tool==="5why"){
    data.problem=g("inv_problem"); data.whys=[1,2,3,4,5].map(i=>g("inv_why"+i)).filter(Boolean); data.conclusion=g("inv_conclusion");
    if(!data.problem||data.whys.length<2) return toast("State the problem and at least two Whys.");
    text=data.conclusion||data.whys[data.whys.length-1];
  }
  if(tool==="6m"){
    data.m={}; SIX_M.forEach(m=>{ const v=g("inv_m_"+m.k); if(v) data.m[m.k]=v; }); data.likely=g("inv_likely");
    if(!Object.keys(data.m).length) return toast("Fill in at least one cause category.");
    text=data.likely||"Fishbone analysis recorded.";
  }
  if(tool==="isnot"){
    data.rows={}; IS_NOT.forEach(r=>{ data.rows[r.k]={is:g("inv_is_"+r.k), not:g("inv_not_"+r.k)}; });
    if(!Object.values(data.rows).some(r=>r.is||r.not)) return toast("Fill in at least one row.");
    data.observation=g("inv_obs"); text=data.observation||"Is / Is-Not analysis recorded.";
  }
  if(tool==="gemba"){
    data.location=g("inv_loc"); data.observed=g("inv_observed"); data.records=g("inv_records"); data.deviation=g("inv_dev");
    if(!data.observed) return toast("Record what was observed.");
    text=data.deviation||data.observed;
  }
  const entry={at:iso(NOW), by:state.user, tool, text, data, attachments:(state.invFiles||[]).slice()};
  c.investigation.push(entry);
  log(c, INV_TOOLS[tool].name+" recorded", text.slice(0,70)+(text.length>70?"…":""));
  state.invFiles=[];
  commit(INV_TOOLS[tool].name+" recorded.");
}
function reviewRca(c, ok){
  const comment=($("#rcareview")?$("#rcareview").value.trim():"");
  c.rca.review={status:ok?"Reviewed":"Returned", by:state.user, at:iso(NOW), comment};
  log(c, ok?"RCA reviewed":"RCA returned for rework", comment);
  commit(ok?"RCA marked as reviewed.":"RCA returned to the investigator.");
}
function saveRca(c){
  const v=$("#rcatext").value.trim(); if(!v) return toast("Describe the root cause first.");
  c.rca={rootCause:v, cause:$("#rcacause").value, at:iso(NOW), by:state.user, review:null};
  state.rcaPrefill="";
  log(c,"RCA recorded", c.rca.cause+" cause documented");
  if(c.status==="Under Investigation") c.status="RCA & CAPA";
  commit("Root cause saved.");
}
function addCapa(c){
  const v=$("#capatext").value.trim(); if(!v) return toast("Describe the action first.");
  const kind=$("#capakind").value;
  c.capa.push({kind, action:v, owner:$("#capaowner").value, target:new Date($("#capatarget").value).toISOString(), status:"Open", effectiveness:null});
  log(c, kind==="CA"?"Corrective action raised":"Preventive action raised", v.slice(0,70)+(v.length>70?"…":""));
  if(c.status==="Under Investigation") c.status="RCA & CAPA";
  commit(kind+" raised.");
}
function advanceCapa(i){
  const c=DB.cases.find(x=>x.id===state.caseId); if(!c) return;
  const a=c.capa[i];
  if(a.status==="Open"){ a.status="In Progress"; log(c,"Action started", a.action.slice(0,60)); commit("Action in progress."); }
  else { a.status="Completed"; a.effectiveness=null; log(c,"Action completed", a.action.slice(0,60)); commit("Action completed — awaiting effectiveness check."); }
}
function verifyCapa(i){
  const c=DB.cases.find(x=>x.id===state.caseId); if(!c) return;
  const a=c.capa[i];
  a.effectiveness="Verified by "+state.user+" on "+fmtD(iso(NOW));
  log(c,"Effectiveness verified", a.action.slice(0,60));
  commit("Effectiveness verified.");
}
function doResolve(c){
  const v=$("#resText").value.trim(); if(!v) return toast("Write the customer-facing resolution.");
  c.resolution={text:v, at:iso(NOW), by:state.user, approvedBy:state.user};
  c.status="Resolved"; log(c,"Resolved","Resolution approved");
  commit("Case resolved.");
}
function doClose(c){
  c.closure={at:iso(NOW), by:state.user, customerConfirmed:$("#custConf").checked};
  c.status="Closed"; log(c,"Closed", c.closure.customerConfirmed?"Customer confirmation received":"Closed without customer confirmation");
  mail(c,"CLOSURE");
  const dups=duplicatesOf(c.id).filter(x=>x.status!=="Closed");
  dups.forEach(x=>{ x.resolution=x.resolution||Object.assign({},c.resolution); x.closure={at:iso(NOW), by:state.user, customerConfirmed:false};
    x.status="Closed"; log(x,"Closed with parent","Outcome inherited from "+c.id); mail(x,"CLOSURE"); });
  commit(dups.length? "Case closed, plus "+dups.length+" linked duplicate"+(dups.length>1?"s":"")+"." : "Case closed.");
}
function addCategory(){
  const n=$("#ncName").value.trim(); if(!n) return toast("Enter a category name.");
  CATEGORIES.push({name:n, dept:$("#ncDept").value, defSev:$("#ncSev").value});
  render(); toast("Category added.");
}
function copyCsv(){
  const r=REPORTS[state.reportKind];
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const csv=[r.cols.map(q).join(","), ...r.rows().map(row=>row.map(q).join(","))].join("\n");
  navigator.clipboard.writeText(csv).then(()=>toast("CSV copied to clipboard.")).catch(()=>toast("Clipboard unavailable in this view."));
}
function doTrackPanel(){
  const ref=(state.portal.trackRef||"").trim().toUpperCase();
  const mob=(state.portal.trackMob||"").trim();
  const c=DB.cases.find(x=>x.id===ref && (!mob || x.customer.mobile.endsWith(mob)));
  state.portal.trackResult = c||null; render();
}

/* ---------- portal flow ---------- */
function startPortalStep(s){
  const m=skuMeta(state.portal.sku);
  state.portal = Object.assign(state.portal, {step:s, page:1,
    data:{consent:false, category:CATEGORIES[0].name, rating:0, batch:state.portal.scanBatch||batchFor(m)},
    errors:{}, evidence:[], trackInline:undefined});
  render();
}
function scan(sku, batch, straightToForm){
  const known = BRANDS.some(b=>b.variants.some(v=>v.sku===sku));
  if(known) state.portal.sku=sku;
  state.portal.scanBatch = batch||null;
  state.view="portal";
  if(!inFrame){ state.consumer=true; state.portal.step="choice"; render(); return; }   // phone scan → consumer-only page
  if(straightToForm) startPortalStep("complaint");
  else { state.portal.step="choice"; render(); }
  const m=skuMeta(state.portal.sku);
  toast("QR scanned — "+m.brand.name+" "+m.v.pack+(batch?" · batch "+batch:"")+" loaded.");
  const ph=document.querySelector(".phone"); if(ph&&ph.scrollIntoView) ph.scrollIntoView({block:"nearest"});
}
function handleHash(){
  const h=location.hash.replace(/^#/,""); if(!h) return false;
  const p=new URLSearchParams(h); const sku=p.get("sku"); if(!sku) return false;
  scan(sku, p.get("b")||null, false);
  return true;
}
window.addEventListener("hashchange", handleHash);
function readInvFiles(files){
  const list=[...files].slice(0,5); let pending=list.length; if(!pending) return;
  state.invFiles=[];
  list.forEach(f=>{ const rec={name:f.name, kind:f.type.startsWith("image")?"image":"doc", dataUrl:null}; state.invFiles.push(rec);
    if(f.type.startsWith("image")&&f.size<5e6){ const r=new FileReader(); r.onload=()=>{rec.dataUrl=r.result; if(--pending===0) render();}; r.onerror=()=>{ if(--pending===0) render(); }; r.readAsDataURL(f); }
    else if(--pending===0) render(); });
}
function readFiles(files){
  const list=[...files].slice(0,5);
  let pending=list.length; if(!pending) return;
  state.portal.evidence=[];
  list.forEach(f=>{
    const rec={name:f.name, kind:f.type.startsWith("image")?"image":"doc", dataUrl:null};
    state.portal.evidence.push(rec);
    if(f.type.startsWith("image") && f.size < 5e6){
      const r=new FileReader(); r.onload=()=>{ rec.dataUrl=r.result; if(--pending===0) render(); }; r.onerror=()=>{ if(--pending===0) render(); }; r.readAsDataURL(f);
    } else if(--pending===0) render();
  });
  if(pending===list.length) render();
}
function portalNav(a){
  const p=state.portal;
  if(a==="back"){
    if(p.step==="track"){ p.step="choice"; }
    else if(p.page>1) p.page--; else p.step="choice";
    p.errors={}; render(); return;
  }
  if(a==="restart"){ state.portal={step:"choice",type:null,data:{},errors:{},evidence:[],ref:null,trackRef:"",trackMob:"",trackResult:undefined,sku:p.sku}; render(); return; }
  if(a==="viewcase"){ openCase(p.ref); return; }
  if(a==="dotrack"){
    const ref=(p.data.tref||"").trim().toUpperCase(), mob=(p.data.tmob||"").trim();
    p.trackInline = DB.cases.find(x=>x.id===ref && (!mob || x.customer.mobile.endsWith(mob))) || null;
    render(); return;
  }
  if(a==="next"){
    const e=validate(); p.errors=e;
    if(Object.keys(e).length){ render(); toast("Please correct the highlighted fields."); return; }
    if(p.page<3){ p.page++; render(); return; }
    submitPortal();
  }
}
function validate(){
  const p=state.portal, d=p.data, e={};
  if(p.page===1){
    if(!(d.name||"").trim()) e.name="Please enter your name.";
    if(!/^\d{10}$/.test((d.mobile||"").trim())) e.mobile="Enter a 10-digit mobile number.";
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test((d.email||"").trim())) e.email="Enter a valid email address.";
    if(!(d.city||"").trim()) e.city="Required.";
    if(!/^\d{6}$/.test((d.pin||"").trim())) e.pin="6 digits.";
    if(!(d.stateName||"").trim()) e.stateName="Please enter your state.";
  }
  if(p.page===2){
    if(p.step==="complaint" && !(d.batch||"").trim()) e.batch="Batch number is printed on the bottle shoulder.";
  }
  if(p.page===3){
    if(!(d.description||"").trim()) e.description=p.step==="complaint"?"Please tell us what happened.":"Please enter your message.";
    if(!d.consent) e.consent="Please confirm to continue.";
  }
  return e;
}
function submitPortal(){
  const p=state.portal, d=p.data, m=skuMeta(p.sku);
  const isC = p.step==="complaint";
  const cat = isC ? (d.category||CATEGORIES[0].name) : "Outer carton damage in transit";
  const sev = isC ? (catOf(cat)?.defSev || "Minor") : "Minor";
  const id = nextId(isC?"Complaint":"Feedback");
  const c = {
    id, type:isC?"Complaint":"Feedback", createdAt:iso(NOW), channel:"Active QR",
    customer:{name:d.name, mobile:d.mobile, email:d.email, city:d.city, state:d.stateName, pin:d.pin},
    product:{brand:m.brand.name, cat:m.brand.cat, variant:m.v.v, sku:m.v.sku, pack:m.v.pack},
    trace:{batch:(d.batch||batchFor(m)).toUpperCase(), mfgDate:iso(addH(NOW,-24*70)), plant:PLANTS[0]},
    purchase:{date:d.purchaseDate?new Date(d.purchaseDate).toISOString():iso(addH(NOW,-24*3)), outlet:d.outlet||"—", location:(d.city||"")+", "+(d.stateName||""), invoice:"—"},
    category:cat, severity:sev, priority:sev==="Critical"?"P1":sev==="Major"?"P2":"P3",
    description:d.description, rating:isC?null:(d.rating||null),
    evidence:p.evidence.slice(), status:"New", department:null, assignee:null,
    investigation:[], rca:null, capa:[], resolution:null, closure:null,
    escalated:false, hold:false, outbox:[], audit:[], duplicateOf:null
  };
  DB.cases.unshift(c);
  const e={at:iso(NOW), by:"Customer portal", action:"Registered", detail:c.type+" received via Active QR ("+c.product.sku+")"};
  c.audit.push(e); DB.audit.unshift(Object.assign({ref:c.id}, e));
  mail(c,"ACK");
  p.ref=id; p.step="done"; save(); render();
}

document.addEventListener("keydown", ev => {
  if(ev.target.id==="qrbox" && (ev.key==="Enter"||ev.key===" ")){ ev.preventDefault(); ev.target.click(); }
});

/* ============================ BOOT ============================ */
if(!load()) seed(); else { let m=false; DB.cases.forEach(c=>{ if(c.status==="Triaged"){c.status="Classified";m=true;} if(c.status==="Assigned"){c.status="Under Investigation";m=true;} c.audit.forEach(a=>{ if(a.action==="Triaged"){a.action="Classified";m=true;} }); }); DB.audit.forEach(a=>{ if(a.action==="Triaged") a.action="Classified"; }); if(m) save(); }
state.portal.page=1;
try{ state.portal.baseUrl = localStorage.getItem(LS_KEY+"_base") || ""; }catch(e){}
if(!handleHash()) render();
</script>
